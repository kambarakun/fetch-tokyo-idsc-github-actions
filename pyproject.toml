[project]
name = "tokyo-epidemic-data-fetcher"
version = "1.0.0"
description = "東京都感染症発生動向データ自動収集システム"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.34.2",
    "PyYAML>=6.0.1",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "black==26.3.1",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
    "isort>=5.12.0",
    "types-requests>=2.33.0.20260518",
    "types-PyYAML>=6.0.1",
    "pre-commit>=4.6.0",
    "jsonschema>=4.18.0",
]

[tool.uv]
required-version = "==0.11.24"

[project.scripts]
fetch-data = "src.cli.fetch_data:main"
process-data = "src.cli.process_data:main"
validate-data = "src.cli.validate_data:main"
verify-metadata = "src.cli.verify_metadata:main"
migrate-metadata = "src.cli.migrate_metadata:main"
check-data-status = "src.cli.check_data_status:main"
cleanup-all-zero-data = "src.cli.cleanup_all_zero_data:main"
check-missing = "src.cli.check_missing:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
explicit_package_bases = true
namespace_packages = true

# pytest configuration is intentionally centralized here.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "RUF",  # Ruff-specific rules (全角文字検出など)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0912", # Too many branches (複雑な検証ロジックで許容)
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements (大規模な関数で許容)
    "PLW0603", # Global statement (遅延初期化パターンで必要)
    "N806",    # Variable in function should be lowercase (定数パターンで許容)
    "PLC0415", # Import should be at top-level (関数内部でのみ使用される型で許容)
    "S310",    # Audit URL open (HTTPSチェック済みで許容)
    "PLR2004", # Magic value used in comparison
    "RUF001", # String contains ambiguous unicode character (日本語文字列を許容)
    # RUF002/RUF003: 全角括弧などの曖昧な文字をコミット前に検出
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]
