name: 📆 毎週データ徹底チェック

on:
  schedule:
    # 毎週木曜日 17:30 JST (08:30 UTC) に実行
    # 木曜夕方の更新を確実にキャッチし、既存ファイルの更新もチェック
    - cron: "30 8 * * 4"
  workflow_dispatch:
    inputs:
      force_update:
        description: "既存ファイルも強制的に再取得（デフォルト: true）"
        required: false
        type: boolean
        default: true
      check_previous_year:
        description: "前年のデータもチェック（1月のみ推奨）"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "テスト実行（データ取得のみでコミットしない）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: write

concurrency:
  # 日次と週次で同じグループを共有し、データ競合を防ぐ
  group: fetch-data
  # 既存の実行をキャンセルしない（データ欠落を防ぐ）
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 週次チェックなので長めに設定

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create directories
        run: |
          mkdir -p data/raw/.metadata data/processed data/logs
          mkdir -p config

      - name: Set environment variables
        run: |
          echo "FETCH_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "CURRENT_YEAR=$(date +'%Y')" >> $GITHUB_ENV
          echo "PREVIOUS_YEAR=$(date -d 'last year' +'%Y')" >> $GITHUB_ENV
          echo "CURRENT_MONTH=$(date +'%m')" >> $GITHUB_ENV
          echo "CURRENT_WEEK=$(date +'%V')" >> $GITHUB_ENV
          echo "GITHUB_RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Prepare fetch parameters
        id: params
        run: |
          # 入力パラメータの処理
          FORCE_UPDATE="${{ github.event.inputs.force_update }}"
          CHECK_PREVIOUS_YEAR="${{ github.event.inputs.check_previous_year }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          # デフォルト値の設定（schedule実行時）
          if [ -z "$FORCE_UPDATE" ]; then
            FORCE_UPDATE="true"  # 週次実行では既存ファイルも再チェック
          fi

          if [ -z "$CHECK_PREVIOUS_YEAR" ]; then
            # 1月の場合は自動的に前年もチェック
            if [ "$CURRENT_MONTH" = "01" ]; then
              CHECK_PREVIOUS_YEAR="true"
              echo "ℹ️ January detected: Automatically enabling previous year check"
            else
              CHECK_PREVIOUS_YEAR="false"
            fi
          fi

          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          # 開始年の決定
          if [ "$CHECK_PREVIOUS_YEAR" = "true" ]; then
            START_YEAR="$PREVIOUS_YEAR"
            echo "📅 Including previous year data: $PREVIOUS_YEAR"
          else
            START_YEAR="$CURRENT_YEAR"
          fi

          # 環境変数として設定
          echo "START_YEAR=$START_YEAR" >> $GITHUB_ENV
          echo "END_YEAR=$CURRENT_YEAR" >> $GITHUB_ENV
          echo "FORCE_UPDATE=$FORCE_UPDATE" >> $GITHUB_ENV
          echo "CHECK_PREVIOUS_YEAR=$CHECK_PREVIOUS_YEAR" >> $GITHUB_ENV
          echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV

          echo "Weekly check parameters:"
          echo "  Start year: $START_YEAR"
          echo "  End year: $CURRENT_YEAR"
          echo "  Current week: $CURRENT_WEEK"
          echo "  Force update: $FORCE_UPDATE"
          echo "  Check previous year: $CHECK_PREVIOUS_YEAR"
          echo "  Dry run: $DRY_RUN"

      - name: Validate existing data before fetch
        id: validate-before
        run: |
          echo "データ取得前の既存データ検証..."
          if [ -d "data/raw" ] && [ "$(ls -A data/raw/*.csv 2>/dev/null | wc -l)" -gt 0 ]; then
            uv run python scripts/validate_data.py data/raw --pattern "*.csv" || true
          else
            echo "No existing data to validate"
          fi

      - name: Fetch epidemic data with full check
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting weekly full data check at $FETCH_TIMESTAMP"

          # コマンドの構築
          FETCH_CMD=(uv run python scripts/fetch_data.py)
          FETCH_CMD+=(--start-year "$START_YEAR")
          FETCH_CMD+=(--end-year "$END_YEAR")

          # 強制更新モード（既存ファイルも再取得）
          if [ "$FORCE_UPDATE" = "true" ]; then
            FETCH_CMD+=(--force-update)
          fi

          # DRY_RUNがtrueの場合
          if [ "$DRY_RUN" = "true" ]; then
            FETCH_CMD+=(--dry-run)
          fi

          FETCH_CMD+=(--log-file "data/logs/weekly_${FETCH_TIMESTAMP}.log")

          echo "Executing: ${FETCH_CMD[@]}"

          # メインスクリプトの実行
          "${FETCH_CMD[@]}" 2>&1 | tee data/logs/console_weekly_${FETCH_TIMESTAMP}.log

          # 実行結果の保存（PIPESTATUS[0]でパイプライン内の最初のコマンドの終了コードを取得）
          echo "FETCH_RESULT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Process epidemic data
        id: process
        if: env.DRY_RUN != 'true'
        run: |
          # パイプラインの終了コードを正しく伝播（pipefailオプション）
          set -o pipefail

          echo "Starting data processing at $(date +'%Y-%m-%d %H:%M:%S')"

          # 変更されたdata/raw/*.csvファイルのみを取得（working treeから）
          # git statusを使用してunstaged/staged両方の変更を検出
          # POSIX準拠の空白クラス [[:space:]] を使用
          mapfile -t CHANGED_RAW_FILES < <(git status --porcelain | grep -E '^[[:space:]]*[AM].*data/raw/.*\.csv$' | sed 's/^...//')

          if [ ${#CHANGED_RAW_FILES[@]} -eq 0 ]; then
            echo "ℹ️ 処理対象のrawファイルがありません。処理をスキップします。"
            echo "PROCESS_RESULT=skipped" >> "$GITHUB_ENV"
          else
            # 変更ファイル数を表示
            FILE_COUNT=${#CHANGED_RAW_FILES[@]}
            echo "📊 処理対象: ${FILE_COUNT}ファイル"
            for file in "${CHANGED_RAW_FILES[@]}"; do
              echo "  - $file"
            done

            # データ処理の実行（変更されたファイルのみ）
            # 配列を安全に展開してスペースを含むファイル名にも対応
            # 注: set -o pipefailにより、パイプ内のPythonスクリプトの終了コードが正しく伝播される
            if uv run python scripts/process_data.py --files "${CHANGED_RAW_FILES[@]}" 2>&1 | tee "data/logs/process_${FETCH_TIMESTAMP}.log"; then
              echo "✅ データ処理: 成功"
              echo "PROCESS_RESULT=success" >> "$GITHUB_ENV"

              # stats.jsonから処理結果を抽出
              if [ -f "data/processed/stats.json" ]; then
                # JSON形式を事前検証（jq -eで検証し、不正な場合は警告）
                if ! jq -e . data/processed/stats.json >/dev/null 2>&1; then
                  echo "⚠️ 警告: stats.jsonが不正なJSON形式です。デフォルト値を使用します。"
                  STATS_TOTAL="0"
                  STATS_SUCCEEDED="0"
                  STATS_FAILED="0"
                else
                  STATS_TOTAL=$(jq -r '.total' data/processed/stats.json 2>/dev/null || echo "0")
                  STATS_SUCCEEDED=$(jq -r '.succeeded' data/processed/stats.json 2>/dev/null || echo "0")
                  STATS_FAILED=$(jq -r '.failed' data/processed/stats.json 2>/dev/null || echo "0")
                fi

                # 環境変数を一括設定（shellcheck SC2129対応）
                {
                  echo "STATS_TOTAL=${STATS_TOTAL}"
                  echo "STATS_SUCCEEDED=${STATS_SUCCEEDED}"
                  echo "STATS_FAILED=${STATS_FAILED}"
                } >> "$GITHUB_ENV"

                echo "📊 処理統計: 成功=${STATS_SUCCEEDED}/${STATS_TOTAL}, 失敗=${STATS_FAILED}"

                # エラー詳細を表示（最大5件）
                ERROR_COUNT=$(jq -r '.errors | length' data/processed/stats.json 2>/dev/null || echo "0")
                if [ "${ERROR_COUNT}" -gt 0 ]; then
                  echo "⚠️ エラー詳細:"
                  jq -r '.errors[:5] | .[] | "  - \(.file): \(.error)"' data/processed/stats.json 2>/dev/null || echo "  エラー詳細の取得に失敗しました"
                  if [ "${ERROR_COUNT}" -gt 5 ]; then
                    echo "  ... 他$((ERROR_COUNT - 5))件のエラー"
                  fi
                fi
              fi
            else
              echo "❌ データ処理: 失敗"
              echo "PROCESS_RESULT=failed" >> "$GITHUB_ENV"

              # 週次実行でも処理失敗時は警告のみでワークフローを継続
              echo "⚠️ 警告: データ処理に失敗しましたが、ワークフローを継続します（週次実行）。"
            fi
          fi

      - name: Create issue on processing failure
        id: create_issue
        if: env.PROCESS_RESULT == 'failed'
        run: |
          echo "📝 処理失敗のGitHub Issueを作成します..."

          ISSUE_TITLE="[自動/週次] データ処理失敗: $(date +'%Y-%m-%d %H:%M')"
          ISSUE_BODY="データ処理ステップが失敗しました（週次実行）。

          発生日時: $(date +'%Y-%m-%d %H:%M:%S %Z')
          ワークフロー実行: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          コミット: ${GITHUB_SHA:0:7}
          Branch: ${GITHUB_REF}
          Actor: ${GITHUB_ACTOR}

          対応方法:
          1. ワークフローログで具体的なエラーメッセージを確認
          2. 処理ログファイル: data/logs/process_${FETCH_TIMESTAMP}.log
          3. 問題を修正後、手動で再実行してください"

          gh issue create \
            --title "${ISSUE_TITLE}" \
            --body "${ISSUE_BODY}" \
            --label "bug,automated,data-processing,weekly-check" \
            --assignee "${GITHUB_ACTOR}" || echo "⚠️ Issue作成に失敗しましたが、処理を継続します"

      - name: Validate fetched data
        id: validate-after
        if: env.DRY_RUN != 'true'
        run: |
          echo "取得したデータの検証..."
          VALIDATION_REPORT="data/logs/validation_${FETCH_TIMESTAMP}.json"

          if uv run python scripts/validate_data.py data/raw --pattern "*.csv" --output "$VALIDATION_REPORT"; then
            echo "✅ データ検証成功"
            echo "VALIDATION_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "❌ データ検証失敗"
            echo "VALIDATION_SUCCESS=false" >> $GITHUB_ENV

            # 検証レポートの内容を表示
            if [ -f "$VALIDATION_REPORT" ]; then
              echo "検証レポート:"
              cat "$VALIDATION_REPORT" | jq .summary
            fi

            # 検証失敗でもPR作成は続行（レビューで確認）
          fi

      - name: Update README statistics
        if: env.DRY_RUN != 'true'
        run: |
          echo "📊 README統計情報を更新しています..."
          uv run python scripts/update_readme_stats.py

          # 変更があればステージング
          if ! git diff --quiet README.md; then
            git add README.md
            echo "✅ README.md updated with latest statistics"
          else
            echo "ℹ️ No README changes needed"
          fi

      - name: Check for changes
        id: changes
        if: env.DRY_RUN != 'true'
        run: |
          # 変更の有無をチェック
          git add data/

          if git diff --cached --quiet; then
            echo "No changes detected"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "Changes detected"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV

            # 新規ファイルと変更ファイルを分けて集計（他のワークフローと統一）
            # POSIX準拠の空白クラス [[:space:]] と拡張正規表現 -E を使用

            # 新規rawファイル数（data/raw/*.csv）
            NEW_RAW_FILES=$(git diff --cached --name-status | grep -E '^A[[:space:]]+data/raw/[^/]*\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 変更されたrawファイル数
            MODIFIED_RAW_FILES=$(git diff --cached --name-status | grep -E '^M[[:space:]]+data/raw/[^/]*\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 処理済みファイル数（data/processed/normalized_*.csv）
            NEW_PROCESSED_FILES=$(git diff --cached --name-status | grep -E '^A[[:space:]]+data/processed/normalized_.*\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 合計CSVファイル数
            TOTAL_CSV_FILES=$(git diff --cached --name-only | grep '\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 空文字列や非数値の場合のフォールバック
            if ! [[ "$NEW_RAW_FILES" =~ ^[0-9]+$ ]]; then
              NEW_RAW_FILES="0"
            fi
            if ! [[ "$MODIFIED_RAW_FILES" =~ ^[0-9]+$ ]]; then
              MODIFIED_RAW_FILES="0"
            fi
            if ! [[ "$NEW_PROCESSED_FILES" =~ ^[0-9]+$ ]]; then
              NEW_PROCESSED_FILES="0"
            fi
            if ! [[ "$TOTAL_CSV_FILES" =~ ^[0-9]+$ ]]; then
              TOTAL_CSV_FILES="0"
            fi

            # 環境変数を設定
            # サマリーとPR作成スクリプトの両方で使用できるよう、2つの命名規則で設定
            NEW_CSV_FILES=$NEW_RAW_FILES
            MODIFIED_CSV_FILES=$MODIFIED_RAW_FILES

            echo "NEW_CSV_FILES=$NEW_CSV_FILES" >> $GITHUB_ENV
            echo "MODIFIED_CSV_FILES=$MODIFIED_CSV_FILES" >> $GITHUB_ENV
            echo "NEW_PROCESSED_FILES=$NEW_PROCESSED_FILES" >> $GITHUB_ENV
            echo "CSV_FILES=$TOTAL_CSV_FILES" >> $GITHUB_ENV

            # サマリー用の変数名も設定（後方互換性）
            echo "NEW_FILES=$NEW_CSV_FILES" >> $GITHUB_ENV
            echo "MODIFIED_FILES=$MODIFIED_CSV_FILES" >> $GITHUB_ENV
            echo "CHANGED_FILES=$TOTAL_CSV_FILES" >> $GITHUB_ENV

            echo "📊 変更統計:"
            echo "  - 新規rawファイル: $NEW_RAW_FILES"
            echo "  - 更新rawファイル: $MODIFIED_RAW_FILES"
            echo "  - 処理済みファイル: $NEW_PROCESSED_FILES"
            echo "  - 合計CSVファイル: $TOTAL_CSV_FILES"
          fi

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true' && env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 共通スクリプトで使用する環境変数
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 詳細統計（他のワークフローと統一）
          NEW_FILES: ${{ env.NEW_CSV_FILES }}
          MODIFIED_FILES: ${{ env.MODIFIED_CSV_FILES }}
          CHANGED_FILES: ${{ env.CSV_FILES }}
          NEW_PROCESSED_FILES: ${{ env.NEW_PROCESSED_FILES }}
        run: |
          # 共通スクリプトを呼び出し
          bash scripts/create_pr.sh "fetch-data-weekly" "週次徹底チェック"

      - name: Create issue on error
        if: failure() && env.DRY_RUN != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issueBody = `## 週次データチェックエラー

            週次の徹底チェック処理でエラーが発生しました。

            ### エラー情報
            - **日時**: ${date} (木曜日)
            - **ワークフロー実行**: ${runUrl}
            - **開始年**: ${process.env.START_YEAR || 'N/A'}
            - **終了年**: ${process.env.END_YEAR || 'N/A'}
            - **前年チェック**: ${process.env.CHECK_PREVIOUS_YEAR || 'false'}

            ### 対応方法
            1. 上記のワークフロー実行リンクからログを確認
            2. エラー内容を特定
            3. 必要に応じて手動で再実行

            ### 自動ラベル
            - weekly-check
            - data-collection
            - error
            - automated`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[週次チェック] データ取得エラー - ${date}`,
              body: issueBody,
              labels: ['weekly-check', 'data-collection', 'error', 'automated']
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-check-logs-${{ env.FETCH_TIMESTAMP }}
          path: data/logs/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 週次データチェックサマリー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **実行日時**: $CURRENT_DATE ${{ env.FETCH_TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **曜日**: 木曜日" >> $GITHUB_STEP_SUMMARY
          echo "- **対象期間**: $START_YEAR - $END_YEAR" >> $GITHUB_STEP_SUMMARY
          echo "- **現在の週**: 第${CURRENT_WEEK}週" >> $GITHUB_STEP_SUMMARY
          echo "- **強制更新**: ${FORCE_UPDATE:-true}" >> $GITHUB_STEP_SUMMARY
          echo "- **前年チェック**: ${CHECK_PREVIOUS_YEAR:-false}" >> $GITHUB_STEP_SUMMARY
          echo "- **ドライラン**: ${DRY_RUN:-false}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$HAS_CHANGES" = "true" ]; then
            echo "### ✅ 変更検出" >> $GITHUB_STEP_SUMMARY
            echo "- **総変更ファイル数**: $CHANGED_FILES" >> $GITHUB_STEP_SUMMARY
            if [ -n "$NEW_FILES" ] && [ "$NEW_FILES" -gt 0 ]; then
              echo "- **新規ファイル**: $NEW_FILES" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "$MODIFIED_FILES" ] && [ "$MODIFIED_FILES" -gt 0 ]; then
              echo "- **更新ファイル**: $MODIFIED_FILES" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "$PR_URL" ]; then
              echo "- **Pull Request**: $PR_URL" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ℹ️ 変更なし" >> $GITHUB_STEP_SUMMARY
            echo "週次チェックで変更は検出されませんでした。" >> $GITHUB_STEP_SUMMARY
          fi
