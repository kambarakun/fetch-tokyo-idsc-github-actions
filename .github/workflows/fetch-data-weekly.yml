name: 📆 毎週データ徹底チェック

on:
  schedule:
    # 毎週木曜日 17:30 JST (08:30 UTC) に実行
    # 木曜夕方の更新を確実にキャッチし、既存ファイルの更新もチェック
    - cron: "30 8 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "データ収集モード (デフォルト: force)"
        required: false
        type: choice
        options:
          - incremental
          - full
          - force
        default: "force"
      check_previous_year:
        description: "前年のデータもチェック (1月のみ推奨)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "テスト実行 (データ取得のみでコミットしない)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: write

concurrency:
  # 日次と週次で同じグループを共有し、データ競合を防ぐ
  group: fetch-data
  # 既存の実行をキャンセルしない (データ欠落を防ぐ)
  cancel-in-progress: false

jobs:
  fetch-data:
    uses: ./.github/workflows/_fetch-data-common.yml
    with:
      workflow_type: "weekly"
      workflow_display_name: "週次徹底チェック"

      # 入力パラメータ
      mode: ${{ inputs.mode || 'force' }}
      check_previous_year: ${{ inputs.check_previous_year || false }}
      dry_run: ${{ inputs.dry_run || false }}

      # weekly固有設定
      validate_before: true
      validate_after: true # weeklyのみ事後検証を実行
      continue_on_failure: true
      auto_merge: true # 週次チェックは問題なければ自動マージ

      # タイムアウトとログ
      timeout_minutes: 180
      log_retention_days: 30
    secrets: inherit
