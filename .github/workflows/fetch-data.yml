name: 📊 東京都感染症データ取得（手動実行）

on:
  workflow_dispatch:
    inputs:
      data_types:
        description: "データタイプ（カンマ区切り、空の場合は全て）"
        required: false
        default: ""
      start_year:
        description: "開始年（デフォルト: 現在年）"
        required: false
        default: ""
      end_year:
        description: "終了年（デフォルト: 現在年）"
        required: false
        default: ""
      dry_run:
        description: "テスト実行（データ取得のみでコミットしない）"
        required: false
        type: boolean
        default: false
      skip_existing:
        description: "既存ファイルをスキップ（新規データのみ取得）"
        required: false
        type: boolean
        default: true
      verify_continuity:
        description: "データの連続性を検証（欠損チェック）"
        required: false
        type: boolean
        default: false
      auto_merge:
        description: "PRを自動マージする（Branch protectionルールに従う）"
        required: false
        type: boolean
        default: false
      force_merge_on_failure:
        description: "データ処理失敗時でもPRを作成してマージする（警告: データ品質が保証されない可能性があります）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: write # PR作成と自動マージに必要

concurrency:
  group: fetch-data
  cancel-in-progress: true

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6時間制限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Verify lockfile is up-to-date
        run: uv lock --check

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create directories
        run: |
          mkdir -p data/raw data/processed data/logs data/quarantine
          mkdir -p config

      - name: Set environment variables
        run: |
          echo "FETCH_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "CURRENT_YEAR=$(date +'%Y')" >> $GITHUB_ENV
          echo "CURRENT_MONTH=$(date +'%m')" >> $GITHUB_ENV
          echo "CURRENT_WEEK=$(date +'%V')" >> $GITHUB_ENV
          echo "GITHUB_RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Prepare fetch parameters
        id: params
        run: |
          # 入力パラメータの処理（schedule実行時はundefinedになるためデフォルト値を設定）
          DATA_TYPES="${{ github.event.inputs.data_types }}"
          START_YEAR="${{ github.event.inputs.start_year }}"
          END_YEAR="${{ github.event.inputs.end_year }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          SKIP_EXISTING="${{ github.event.inputs.skip_existing }}"
          VERIFY_CONTINUITY="${{ github.event.inputs.verify_continuity }}"
          AUTO_MERGE="${{ github.event.inputs.auto_merge }}"
          FORCE_MERGE_ON_FAILURE="${{ github.event.inputs.force_merge_on_failure }}"

          # デフォルト値の設定
          if [ -z "$START_YEAR" ]; then
            START_YEAR="$CURRENT_YEAR"
          fi

          if [ -z "$END_YEAR" ]; then
            END_YEAR="$CURRENT_YEAR"
          fi

          # DRY_RUNのデフォルト値（schedule実行時はfalse）
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          # SKIP_EXISTINGのデフォルト値（手動実行時はtrue）
          if [ -z "$SKIP_EXISTING" ]; then
            SKIP_EXISTING="true"
          fi

          # VERIFY_CONTINUITYのデフォルト値
          if [ -z "$VERIFY_CONTINUITY" ]; then
            VERIFY_CONTINUITY="false"
          fi

          # AUTO_MERGEのデフォルト値（schedule実行時はfalse）
          if [ -z "$AUTO_MERGE" ]; then
            AUTO_MERGE="false"
          fi

          # FORCE_MERGE_ON_FAILUREのデフォルト値
          if [ -z "$FORCE_MERGE_ON_FAILURE" ]; then
            FORCE_MERGE_ON_FAILURE="false"
          fi

          # 環境変数として設定
          echo "DATA_TYPES=$DATA_TYPES" >> $GITHUB_ENV
          echo "START_YEAR=$START_YEAR" >> $GITHUB_ENV
          echo "END_YEAR=$END_YEAR" >> $GITHUB_ENV
          echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV
          echo "SKIP_EXISTING=$SKIP_EXISTING" >> $GITHUB_ENV
          echo "VERIFY_CONTINUITY=$VERIFY_CONTINUITY" >> $GITHUB_ENV
          echo "AUTO_MERGE=$AUTO_MERGE" >> $GITHUB_ENV
          echo "FORCE_MERGE_ON_FAILURE=$FORCE_MERGE_ON_FAILURE" >> $GITHUB_ENV

          echo "Fetch parameters:"
          echo "  Data types: ${DATA_TYPES:-ALL}"
          echo "  Start year: $START_YEAR"
          echo "  End year: $END_YEAR"
          echo "  Dry run: $DRY_RUN"
          echo "  Skip existing: $SKIP_EXISTING"
          echo "  Verify continuity: $VERIFY_CONTINUITY"
          echo "  Auto merge: $AUTO_MERGE"
          echo "  Force merge on failure: $FORCE_MERGE_ON_FAILURE"

      - name: Fetch epidemic data
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting data fetch at $FETCH_TIMESTAMP"

          # コマンドの構築（配列ベースで安全な実装）
          FETCH_CMD=(uv run python scripts/fetch_data.py)
          FETCH_CMD+=(--start-year "$START_YEAR")
          FETCH_CMD+=(--end-year "$END_YEAR")

          if [ -n "$DATA_TYPES" ]; then
            FETCH_CMD+=(--data-types "$DATA_TYPES")
          fi

          # DRY_RUNがtrueの場合のみ--dry-runフラグを追加
          if [ "$DRY_RUN" = "true" ]; then
            FETCH_CMD+=(--dry-run)
          fi

          # SKIP_EXISTINGがtrueの場合のみ--skip-existingフラグを追加
          if [ "$SKIP_EXISTING" = "true" ]; then
            FETCH_CMD+=(--skip-existing)
          fi

          FETCH_CMD+=(--log-file "data/logs/fetch_${FETCH_TIMESTAMP}.log")

          echo "Executing: ${FETCH_CMD[@]}"

          # メインスクリプトの実行（配列展開による安全な実行）
          "${FETCH_CMD[@]}" 2>&1 | tee data/logs/console_${FETCH_TIMESTAMP}.log

          # 実行結果の保存
          echo "FETCH_RESULT=$?" >> $GITHUB_ENV

      - name: Process epidemic data
        id: process
        if: env.DRY_RUN != 'true'
        run: |
          echo "Starting data processing at $(date +'%Y-%m-%d %H:%M:%S')"

          # データ処理の実行（全ファイル処理）
          # 注: process_data.pyは失敗時にexit 1を返すため、パイプラインの最終終了コードを確認
          if uv run python scripts/process_data.py --all 2>&1 | tee "data/logs/process_${FETCH_TIMESTAMP}.log"; then
            echo "✅ データ処理: 成功"
            echo "PROCESS_RESULT=success" >> "$GITHUB_ENV"

            # stats.jsonから処理結果を抽出
            if [ -f "data/processed/stats.json" ]; then
              STATS_TOTAL=$(jq -r '.total' data/processed/stats.json)
              STATS_SUCCEEDED=$(jq -r '.succeeded' data/processed/stats.json)
              STATS_FAILED=$(jq -r '.failed' data/processed/stats.json)

              echo "STATS_TOTAL=${STATS_TOTAL}" >> "$GITHUB_ENV"
              echo "STATS_SUCCEEDED=${STATS_SUCCEEDED}" >> "$GITHUB_ENV"
              echo "STATS_FAILED=${STATS_FAILED}" >> "$GITHUB_ENV"

              echo "📊 処理統計: 成功=${STATS_SUCCEEDED}/${STATS_TOTAL}, 失敗=${STATS_FAILED}"

              # エラー詳細を表示（最大5件）
              ERROR_COUNT=$(jq -r '.errors | length' data/processed/stats.json)
              if [ "${ERROR_COUNT}" -gt 0 ]; then
                echo "⚠️ エラー詳細:"
                jq -r '.errors[:5] | .[] | "  - \(.file): \(.error)"' data/processed/stats.json
                if [ "${ERROR_COUNT}" -gt 5 ]; then
                  echo "  ... 他$((ERROR_COUNT - 5))件のエラー"
                fi
              fi
            fi
          else
            echo "❌ データ処理: 失敗"
            echo "PROCESS_RESULT=failed" >> "$GITHUB_ENV"

            # 強制マージオプションが有効な場合は警告のみでワークフローを継続
            if [ "$FORCE_MERGE_ON_FAILURE" = "true" ]; then
              echo "⚠️ 警告: 強制マージオプションが有効です。データ処理に失敗しましたが、ワークフローを継続します。"
              echo "⚠️ データ品質が保証されない可能性があります。"
            else
              # データ処理は重要なステップなので、失敗時はワークフローを停止
              echo "💥 データ処理に失敗したため、ワークフローを停止します。"
              echo "💡 強制的にマージしたい場合は、force_merge_on_failure オプションを有効にして再実行してください。"
              exit 1
            fi
          fi

      - name: Verify data continuity
        id: verify
        if: env.VERIFY_CONTINUITY == 'true'
        run: |
          echo "データの連続性を検証しています..."

          # 検証スクリプトの実行
          if uv run python scripts/validate_continuity.py data/raw \
              --start-year "$START_YEAR" \
              --end-year "$END_YEAR" \
              --format markdown \
              --output "data/logs/continuity_report_${FETCH_TIMESTAMP}.md"; then

            echo "✅ データ連続性検証: 成功"
            echo "CONTINUITY_VALID=true" >> $GITHUB_ENV

            # レポートを表示
            echo "## 連続性検証レポート" >> $GITHUB_STEP_SUMMARY
            cat "data/logs/continuity_report_${FETCH_TIMESTAMP}.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ データ連続性検証: 欠損を検出"
            echo "CONTINUITY_VALID=false" >> $GITHUB_ENV

            # レポートを表示
            echo "## ⚠️ 連続性検証レポート - 欠損検出" >> $GITHUB_STEP_SUMMARY
            cat "data/logs/continuity_report_${FETCH_TIMESTAMP}.md" >> $GITHUB_STEP_SUMMARY

            # テキスト形式のレポートも生成
            uv run python scripts/validate_continuity.py data/raw \
              --start-year "$START_YEAR" \
              --end-year "$END_YEAR" \
              --format text || true
          fi

      - name: Check for changes
        id: changes
        if: env.DRY_RUN != 'true'
        run: |
          # 変更の有無をチェック
          git add data/

          if git diff --cached --quiet; then
            echo "No changes detected"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "Changes detected"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV

            # 新規ファイルと変更ファイルを分けて集計
            # 新規rawファイル数（data/raw/*.csv）
            NEW_RAW_FILES=$(git diff --cached --name-status | grep '^A\s\+data/raw/[^/]*\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 変更されたrawファイル数
            MODIFIED_RAW_FILES=$(git diff --cached --name-status | grep '^M\s\+data/raw/[^/]*\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 処理済みファイル数（data/processed/normalized_*.csv）
            NEW_PROCESSED_FILES=$(git diff --cached --name-status | grep '^A\s\+data/processed/normalized_.*\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 合計CSVファイル数
            TOTAL_CSV_FILES=$(git diff --cached --name-only | grep '\.csv$' | wc -l | tr -d ' ' || echo "0")

            # 空文字列や非数値の場合のフォールバック
            if ! [[ "$NEW_RAW_FILES" =~ ^[0-9]+$ ]]; then
              NEW_RAW_FILES="0"
            fi
            if ! [[ "$MODIFIED_RAW_FILES" =~ ^[0-9]+$ ]]; then
              MODIFIED_RAW_FILES="0"
            fi
            if ! [[ "$NEW_PROCESSED_FILES" =~ ^[0-9]+$ ]]; then
              NEW_PROCESSED_FILES="0"
            fi
            if ! [[ "$TOTAL_CSV_FILES" =~ ^[0-9]+$ ]]; then
              TOTAL_CSV_FILES="0"
            fi

            # fetch-data用の変数名を設定（後方互換性のため）
            NEW_CSV_FILES=$NEW_RAW_FILES
            MODIFIED_CSV_FILES=$MODIFIED_RAW_FILES

            echo "NEW_CSV_FILES=$NEW_CSV_FILES" >> $GITHUB_ENV
            echo "MODIFIED_CSV_FILES=$MODIFIED_CSV_FILES" >> $GITHUB_ENV
            echo "NEW_PROCESSED_FILES=$NEW_PROCESSED_FILES" >> $GITHUB_ENV
            echo "CSV_FILES=$TOTAL_CSV_FILES" >> $GITHUB_ENV

            echo "📊 変更統計:"
            echo "  - 新規rawファイル: $NEW_RAW_FILES"
            echo "  - 更新rawファイル: $MODIFIED_RAW_FILES"
            echo "  - 処理済みファイル: $NEW_PROCESSED_FILES"
            echo "  - 合計CSVファイル: $TOTAL_CSV_FILES"
          fi

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true' && env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 共通スクリプトで使用する環境変数
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # fetch-data固有の変数をエクスポート（CSVファイル数の扱い）
          NEW_FILES: ${{ env.NEW_CSV_FILES }}
          MODIFIED_FILES: ${{ env.MODIFIED_CSV_FILES }}
          CHANGED_FILES: ${{ env.CSV_FILES }}
          NEW_PROCESSED_FILES: ${{ env.NEW_PROCESSED_FILES }}
        run: |
          # 共通スクリプトを呼び出し
          bash scripts/create_pr.sh "fetch-data" "手動/スケジュール実行"

      - name: Create issue on error
        if: failure() && env.DRY_RUN != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issueBody = `## データ取得エラー

            データ取得処理でエラーが発生しました。

            ### エラー情報
            - **日時**: ${date}
            - **ワークフロー実行**: ${runUrl}
            - **開始年**: ${process.env.START_YEAR || 'N/A'}
            - **終了年**: ${process.env.END_YEAR || 'N/A'}
            - **データタイプ**: ${process.env.DATA_TYPES || 'ALL'}

            ### 対応方法
            1. 上記のワークフロー実行リンクからログを確認
            2. エラー内容を特定
            3. 必要に応じて手動で再実行

            ### 自動ラベル
            - data-collection
            - error
            - automated`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[自動通知] データ取得エラー - ${date}`,
              body: issueBody,
              labels: ['data-collection', 'error', 'automated']
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ env.FETCH_TIMESTAMP }}
          path: data/logs/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 データ取得サマリー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **実行日時**: $CURRENT_DATE ${{ env.FETCH_TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **対象期間**: $START_YEAR - $END_YEAR" >> $GITHUB_STEP_SUMMARY
          echo "- **データタイプ**: ${DATA_TYPES:-ALL}" >> $GITHUB_STEP_SUMMARY
          echo "- **ドライラン**: ${DRY_RUN:-false}" >> $GITHUB_STEP_SUMMARY
          echo "- **自動マージ**: ${AUTO_MERGE:-false}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$HAS_CHANGES" = "true" ]; then
            echo "### ✅ 変更" >> $GITHUB_STEP_SUMMARY
            echo "#### 生データ（data/raw/）" >> $GITHUB_STEP_SUMMARY
            if [ "${NEW_CSV_FILES:-0}" -gt 0 ] && [ "${MODIFIED_CSV_FILES:-0}" -gt 0 ]; then
              echo "- **新規**: ${NEW_CSV_FILES}件" >> $GITHUB_STEP_SUMMARY
              echo "- **更新**: ${MODIFIED_CSV_FILES}件" >> $GITHUB_STEP_SUMMARY
            elif [ "${NEW_CSV_FILES:-0}" -gt 0 ]; then
              echo "- **新規**: ${NEW_CSV_FILES}件" >> $GITHUB_STEP_SUMMARY
            elif [ "${MODIFIED_CSV_FILES:-0}" -gt 0 ]; then
              echo "- **更新**: ${MODIFIED_CSV_FILES}件" >> $GITHUB_STEP_SUMMARY
            else
              echo "- 変更なし" >> $GITHUB_STEP_SUMMARY
            fi

            if [ "${NEW_PROCESSED_FILES:-0}" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### 処理済みデータ（data/processed/）" >> $GITHUB_STEP_SUMMARY
              echo "- **処理済み**: ${NEW_PROCESSED_FILES}件" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**合計**: ${CSV_FILES:-0}ファイル" >> $GITHUB_STEP_SUMMARY

            if [ -n "$PR_URL" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **Pull Request**: $PR_URL" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ℹ️ 変更なし" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 ストレージ情報" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "生データ: $(du -sh data/raw/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "処理済み: $(du -sh data/processed/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
