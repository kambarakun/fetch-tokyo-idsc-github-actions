name: 📊 東京都感染症データ取得（手動実行）

on:
  workflow_dispatch:
    inputs:
      data_types:
        description: "📊 データタイプ (カンマ区切り。空欄=全タイプ取得)"
        required: false
        default: ""
      start_year:
        description: "📅 開始年 (デフォルト: 現在年)"
        required: false
        default: ""
      end_year:
        description: "📅 終了年 (デフォルト: 現在年)"
        required: false
        default: ""
      dry_run:
        description: "🧪 テスト実行モード (データ取得のみ、コミット/PR作成なし)"
        required: false
        type: boolean
        default: false
      mode:
        description: "📊 データ収集モード: incremental(欠損のみ), full(全期間+更新チェック), force(強制再取得)"
        required: false
        type: choice
        options:
          - incremental
          - full
          - force
        default: "full"
      verify_continuity:
        description: "🔍 データ連続性検証 (欠損データの有無をチェック)"
        required: false
        type: boolean
        default: false
      auto_merge:
        description: "🔀 PR自動マージ (Branch protectionルールに従う)"
        required: false
        type: boolean
        default: false
      force_merge_on_failure:
        description: "⚠️ 処理失敗時も強制マージ (警告: データ品質が保証されない可能性あり)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: write # PR作成と自動マージに必要

concurrency:
  # 手動実行も日次/週次と同じグループを共有し、データ競合を防ぐ
  group: fetch-data
  # 既存の実行をキャンセルしない (データ欠落を防ぐ)
  cancel-in-progress: false

jobs:
  fetch-data:
    uses: ./.github/workflows/_fetch-data-common.yml
    with:
      workflow_type: "manual"
      workflow_display_name: "手動/スケジュール実行"

      # データ範囲指定 (全て渡す)
      start_year: ${{ inputs.start_year || '' }}
      end_year: ${{ inputs.end_year || '' }}
      data_types: ${{ inputs.data_types || '' }}

      # 動作モード
      mode: ${{ inputs.mode || 'full' }}
      dry_run: ${{ inputs.dry_run || false }}

      # manual専用機能
      verify_lockfile: true # manualのみuv lock --checkを実行
      verify_continuity: ${{ inputs.verify_continuity || false }}
      auto_merge: ${{ inputs.auto_merge || false }}
      force_merge_on_failure: ${{ inputs.force_merge_on_failure || false }}

      # manual固有設定
      continue_on_failure: false # manualは失敗時に停止 (force_merge_on_failureで制御)

      # タイムアウトとログ
      timeout_minutes: 360 # 6時間
      log_retention_days: 30
    secrets: inherit
