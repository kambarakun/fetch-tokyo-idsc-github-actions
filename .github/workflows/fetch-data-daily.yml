name: 📅 毎日データ簡易チェック

on:
  schedule:
    # 毎日 17:00 JST (08:00 UTC) に実行
    # 木曜夕方の更新を確実にキャッチ
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "データ収集モード (デフォルト: incremental)"
        required: false
        type: choice
        options:
          - incremental
          - full
          - force
        default: "incremental"
      dry_run:
        description: "テスト実行（データ取得のみでコミットしない）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: write

concurrency:
  # 日次と週次で同じグループを共有し、データ競合を防ぐ
  group: fetch-data
  # 既存の実行をキャンセルしない（データ欠落を防ぐ）
  cancel-in-progress: false

jobs:
  # 日付計算用 (workflow_call内でdate実行不可のため)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      start_year: ${{ steps.calc.outputs.start_year }}
      target_weeks: ${{ steps.calc.outputs.target_weeks }}
      target_months: ${{ steps.calc.outputs.target_months }}
    steps:
      - name: Calculate date ranges
        id: calc
        run: |
          # 2週前、前週、当週の週番号を計算
          TWO_WEEKS_AGO=$(date -d '2 weeks ago' +'%V')
          TWO_WEEKS_AGO_YEAR=$(date -d '2 weeks ago' +'%G')
          PREVIOUS_WEEK=$(date -d 'last week' +'%V')
          CURRENT_WEEK=$(date +'%V')
          CURRENT_YEAR=$(date +'%G')

          # 開始年を計算 (最小値)
          START_YEAR=$(echo -e "$TWO_WEEKS_AGO_YEAR\n$CURRENT_YEAR" | sort -n | head -1)

          # 対象週・月をカンマ区切りで設定
          TARGET_WEEKS="${TWO_WEEKS_AGO},${PREVIOUS_WEEK},${CURRENT_WEEK}"
          TARGET_MONTHS="$(date -d 'last month' +'%m'),$(date +'%m')"

          echo "start_year=$START_YEAR" >> $GITHUB_OUTPUT
          echo "target_weeks=$TARGET_WEEKS" >> $GITHUB_OUTPUT
          echo "target_months=$TARGET_MONTHS" >> $GITHUB_OUTPUT

  # 共通ワークフロー呼び出し
  fetch-data:
    needs: prepare
    uses: ./.github/workflows/_fetch-data-common.yml
    with:
      workflow_type: "daily"
      workflow_display_name: "毎日簡易チェック"

      # prepare jobで計算した値
      start_year: ${{ needs.prepare.outputs.start_year }}
      target_weeks: ${{ needs.prepare.outputs.target_weeks }}
      target_months: ${{ needs.prepare.outputs.target_months }}

      # 入力パラメータ (デフォルト値設定)
      mode: ${{ inputs.mode || 'incremental' }}
      dry_run: ${{ inputs.dry_run || false }}

      # daily固有設定
      validate_before: true
      continue_on_failure: true

      # タイムアウトとログ
      timeout_minutes: 60
      log_retention_days: 7
    secrets: inherit
