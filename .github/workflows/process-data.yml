name: ⚙️ データ処理（raw→processed変換・手動実行）

on:
  workflow_dispatch:
    inputs:
      target_files:
        description: "📁 処理対象ファイル (カンマ区切りのパス。空欄=全rawファイル処理)"
        required: false
        default: ""
      dry_run:
        description: "🧪 ドライラン (引数とdataディレクトリの存在のみ確認。対象ファイル確認・変換・品質検証・コミット/PR作成はしない)"
        required: false
        type: boolean
        default: false
      verify_output:
        description: "🔍 出力データ検証 (validate-data。不合格/検証不能ならPR作成後にジョブ失敗。falseでは品質未検証)"
        required: false
        type: boolean
        default: false
      auto_merge:
        description: "🔀 PR自動マージ (Branch protectionルールに従う)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: write

concurrency:
  group: process-data
  cancel-in-progress: true

jobs:
  process-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 1時間制限

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv の pin は .tool-versions に置く (issue #681): 未指定だと pyproject/uv.toml -> latest の順で解決される
          version-file: .tool-versions
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create directories
        run: |
          mkdir -p data/raw data/processed data/logs
          mkdir -p config

      - name: Set environment variables
        run: |
          {
            echo "FETCH_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')"
            echo "PROCESS_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')"
            echo "CURRENT_DATE=$(date +'%Y-%m-%d')"
            echo "GITHUB_RUN_ID=${{ github.run_id }}"
          } >> "$GITHUB_ENV"

      - name: Prepare processing parameters
        id: params
        run: |
          TARGET_FILES="${{ github.event.inputs.target_files }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          VERIFY_OUTPUT="${{ github.event.inputs.verify_output }}"
          AUTO_MERGE="${{ github.event.inputs.auto_merge }}"

          # デフォルト値の設定
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          if [ -z "$VERIFY_OUTPUT" ]; then
            VERIFY_OUTPUT="false"
          fi

          if [ -z "$AUTO_MERGE" ]; then
            AUTO_MERGE="false"
          fi

          # 品質検証の状態: not_requested / not_run (要求されたが未実行) / passed / failed / error
          if [ "$VERIFY_OUTPUT" = "true" ]; then
            VALIDATION_STATUS="not_run"
          else
            VALIDATION_STATUS="not_requested"
          fi

          # 環境変数として設定
          {
            echo "TARGET_FILES=$TARGET_FILES"
            echo "DRY_RUN=$DRY_RUN"
            echo "VERIFY_OUTPUT=$VERIFY_OUTPUT"
            echo "AUTO_MERGE=$AUTO_MERGE"
            echo "VALIDATION_STATUS=$VALIDATION_STATUS"
          } >> "$GITHUB_ENV"

          echo "Processing parameters:"
          echo "  Target files: ${TARGET_FILES:-ALL raw/*.csv}"
          echo "  Dry run: $DRY_RUN"
          echo "  Verify output: $VERIFY_OUTPUT"
          echo "  Auto merge: $AUTO_MERGE"

      - name: Process epidemic data
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          echo "Starting data processing at $PROCESS_TIMESTAMP"

          # コマンドの構築
          PROCESS_CMD=(uv run --locked process-data)

          # ターゲットファイルの指定
          if [ -n "$TARGET_FILES" ]; then
            # カンマ区切りをスペース区切りに変換
            IFS=',' read -ra FILES <<< "$TARGET_FILES"
            PROCESS_CMD+=(--files "${FILES[@]}")
          else
            # ターゲットファイルが指定されていない場合は全ファイルを処理
            PROCESS_CMD+=(--all)
          fi

          STATS_FILE="data/processed/stats.json"
          if [ "$DRY_RUN" = "true" ]; then
            PROCESS_CMD+=(--dry-run)
          else
            # 前回 run の stats.json を今回の実績として読まないよう、処理前に除く (成功した処理が書き直す)
            rm -f "$STATS_FILE"
          fi

          echo "Executing: ${PROCESS_CMD[*]}"

          # メインスクリプトの実行
          if ! "${PROCESS_CMD[@]}" 2>&1 | tee "data/logs/console_${PROCESS_TIMESTAMP}.log"; then
            echo "❌ データ処理: 失敗"
            echo "PROCESS_RESULT=failed" >> "$GITHUB_ENV"
            echo "💥 データ処理に失敗したため、ワークフローを停止します。"
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            # ドライランは引数と data ディレクトリしか確認しない。既存の stats.json は今回の結果ではないので読まない
            echo "🧪 ドライラン: 対象ファイルの存在・変換・品質は未確認です"
            echo "PROCESS_RESULT=dry_run" >> "$GITHUB_ENV"
            exit 0
          fi

          # 今回の処理が書いた stats.json だけを実績とする。欠落・不正を 0 件成功に落とさない
          if ! jq -e '
              def count: type == "number" and . == floor and . >= 0;
              (.total | count) and (.succeeded | count) and (.failed | count)
              and ((.skipped // 0) | count) and (.errors | type == "array")
              and .succeeded + .failed == .total
            ' "$STATS_FILE" >/dev/null 2>&1; then
            echo "::error title=Processing stats missing or invalid::今回の処理統計 ($STATS_FILE) が生成されていないか不正です"
            echo "PROCESS_RESULT=failed" >> "$GITHUB_ENV"
            exit 1
          fi

          STATS_TOTAL=$(jq -r '.total' "$STATS_FILE")
          STATS_SUCCEEDED=$(jq -r '.succeeded' "$STATS_FILE")
          STATS_FAILED=$(jq -r '.failed' "$STATS_FILE")
          STATS_SKIPPED=$(jq -r '.skipped // 0' "$STATS_FILE")
          {
            echo "PROCESS_RESULT=success"
            echo "STATS_TOTAL=${STATS_TOTAL}"
            echo "STATS_SUCCEEDED=${STATS_SUCCEEDED}"
            echo "STATS_FAILED=${STATS_FAILED}"
            echo "STATS_SKIPPED=${STATS_SKIPPED}"
          } >> "$GITHUB_ENV"

          echo "✅ データ処理: 成功"
          echo "📊 処理統計: 成功=${STATS_SUCCEEDED}/${STATS_TOTAL}, 失敗=${STATS_FAILED}, スキップ=${STATS_SKIPPED}"
          if [ "$STATS_TOTAL" -eq 0 ]; then
            echo "::warning title=No files processed::今回の処理対象は0件でした。target_files とスキップ件数を確認してください"
          fi

          # エラー詳細を表示（最大5件）
          ERROR_COUNT=$(jq -r '.errors | length' "$STATS_FILE")
          if [ "${ERROR_COUNT}" -gt 0 ]; then
            echo "⚠️ エラー詳細:"
            jq -r '.errors[:5] | .[] | "  - \(.file): \(.error)"' "$STATS_FILE" || echo "  エラー詳細の取得に失敗しました"
            if [ "${ERROR_COUNT}" -gt 5 ]; then
              echo "  ... 他$((ERROR_COUNT - 5))件のエラー"
            fi
          fi

      - name: Create issue on processing failure
        id: create_issue
        if: env.PROCESS_RESULT == 'failed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📝 処理失敗のGitHub Issueを作成します..."

          ISSUE_TITLE="[自動] データ処理失敗: $(date +'%Y-%m-%d %H:%M')"
          ISSUE_BODY="データ処理ステップが失敗しました。

          発生日時: $(date +'%Y-%m-%d %H:%M:%S %Z')
          ワークフロー実行: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          コミット: ${GITHUB_SHA:0:7}
          Branch: ${GITHUB_REF}
          Actor: ${GITHUB_ACTOR}

          対応方法:
          1. ワークフローログで具体的なエラーメッセージを確認
          2. 処理ログファイル: data/logs/process_${PROCESS_TIMESTAMP}.log
          3. 問題を修正後、手動で再実行してください"

          gh issue create \
            --title "${ISSUE_TITLE}" \
            --body "${ISSUE_BODY}" \
            --label "bug,automated,data-processing" \
            --assignee "${GITHUB_ACTOR}" || echo "⚠️ Issue作成に失敗しましたが、処理を継続します"

      - name: Verify processed data
        id: verify
        if: env.VERIFY_OUTPUT == 'true' && env.PROCESS_RESULT == 'success'
        run: |
          echo "処理済みデータを検証しています..."
          REPORT="data/logs/validation_report_${PROCESS_TIMESTAMP}.json"

          # 検証スクリプトの実行 (processed データは UTF-8)。非 0 でも状態を記録してから後続へ進む
          VALIDATE_EXIT=0
          uv run --locked validate-data data/processed \
            --encoding utf-8 \
            --format json \
            --output "$REPORT" || VALIDATE_EXIT=$?

          # 終了値とレポートが一致したときだけ合否を確定する。食い違い・レポート欠落/不正・0 件は検証不能
          REPORT_HAS_ERRORS=$(jq -r '
            .summary
            | if (.total_files | type) == "number" and .total_files > 0 and (.has_errors | type) == "boolean"
              then .has_errors else "invalid" end
          ' "$REPORT" 2>/dev/null || echo "unreadable")
          case "${VALIDATE_EXIT}:${REPORT_HAS_ERRORS}" in
            0:false) VALIDATION_STATUS="passed" ;;
            1:true) VALIDATION_STATUS="failed" ;;
            *) VALIDATION_STATUS="error" ;;
          esac

          # VALIDATION_PASSED は合格時だけ true (auto_merge_gate.sh の既存ゲートが参照する)
          VALIDATION_PASSED="false"
          if [ "$VALIDATION_STATUS" = "passed" ]; then
            VALIDATION_PASSED="true"
          fi
          {
            echo "VALIDATION_STATUS=$VALIDATION_STATUS"
            echo "VALIDATION_PASSED=$VALIDATION_PASSED"
          } >> "$GITHUB_ENV"

          echo "データ検証: ${VALIDATION_STATUS} (validate-data exit=${VALIDATE_EXIT}, report has_errors=${REPORT_HAS_ERRORS})"
          {
            echo "## 🔍 データ検証レポート (${VALIDATION_STATUS})"
            echo "- validate-data 終了コード: ${VALIDATE_EXIT}"
            echo "- レポート: \`${REPORT}\`"
            jq -r '.summary | "- 検証ファイル数: \(.total_files) / 有効: \(.valid_files) / 無効: \(.invalid_files)"' \
              "$REPORT" 2>/dev/null || echo "- レポートを読めませんでした"
            jq -r '[.results[]? | select(.valid == false)][:20][] | "- `\(.file)`: \((.errors // []) | join("; "))"' \
              "$REPORT" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: changes
        if: env.DRY_RUN != 'true'
        run: |
          # 変更の有無をチェック
          git add data/

          if git diff --cached --quiet; then
            echo "No changes detected"
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "Changes detected"
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

            # 処理済みファイル数を集計
            NEW_PROCESSED_FILES=$(git diff --cached --name-status | grep -c '^A\s\+data/processed/normalized_.*\.csv$' | tr -d ' ' || echo "0")
            MODIFIED_PROCESSED_FILES=$(git diff --cached --name-status | grep -c '^M\s\+data/processed/.*\.csv$' | tr -d ' ' || echo "0")
            TOTAL_CSV_FILES=$(git diff --cached --name-only | grep -c '\.csv$' | tr -d ' ' || echo "0")

            # 空文字列や非数値の場合のフォールバック
            if ! [[ "$NEW_PROCESSED_FILES" =~ ^[0-9]+$ ]]; then
              NEW_PROCESSED_FILES="0"
            fi
            if ! [[ "$MODIFIED_PROCESSED_FILES" =~ ^[0-9]+$ ]]; then
              MODIFIED_PROCESSED_FILES="0"
            fi
            if ! [[ "$TOTAL_CSV_FILES" =~ ^[0-9]+$ ]]; then
              TOTAL_CSV_FILES="0"
            fi

            {
              echo "NEW_PROCESSED_FILES=$NEW_PROCESSED_FILES"
              echo "MODIFIED_PROCESSED_FILES=$MODIFIED_PROCESSED_FILES"
              echo "CSV_FILES=$TOTAL_CSV_FILES"
            } >> "$GITHUB_ENV"

            echo "📊 変更統計:"
            echo "  - 新規処理済みファイル: $NEW_PROCESSED_FILES"
            echo "  - 更新処理済みファイル: $MODIFIED_PROCESSED_FILES"
            echo "  - 合計CSVファイル: $TOTAL_CSV_FILES"
          fi

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true' && env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # process-data固有の変数をエクスポート
          NEW_FILES: ${{ env.NEW_PROCESSED_FILES }}
          MODIFIED_FILES: ${{ env.MODIFIED_PROCESSED_FILES }}
          CHANGED_FILES: ${{ env.CSV_FILES }}
          TARGET_FILES: ${{ env.TARGET_FILES }}
          VERIFY_OUTPUT: ${{ env.VERIFY_OUTPUT }}
          VALIDATION_PASSED: ${{ env.VALIDATION_PASSED }}
        run: |
          # 共通スクリプトを呼び出し
          bash scripts/create_pr.sh "process-data" "手動実行"

      - name: Create issue on error
        if: failure() && env.DRY_RUN != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issueBody = `## データ処理エラー

            データ処理（raw→processed変換）でエラーが発生しました。

            ### エラー情報
            - **日時**: ${date}
            - **ワークフロー実行**: ${runUrl}
            - **対象ファイル**: ${process.env.TARGET_FILES || 'ALL raw/*.csv'}

            ### 対応方法
            1. 上記のワークフロー実行リンクからログを確認
            2. エラー内容を特定
            3. 必要に応じて手動で再実行

            ### 自動ラベル
            - data-processing
            - error
            - automated`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[自動通知] データ処理エラー - ${date}`,
              body: issueBody,
              labels: ['data-processing', 'error', 'automated']
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-logs-${{ env.PROCESS_TIMESTAMP }}
          path: data/logs/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## ⚙️ データ処理サマリー"
            echo ""
            echo "- **実行日時**: $CURRENT_DATE ${{ env.PROCESS_TIMESTAMP }}"
            echo "- **対象ファイル**: ${TARGET_FILES:-ALL raw/*.csv}"
            echo "- **ドライラン**: ${DRY_RUN:-false}"
            echo "- **出力データ検証 (verify_output)**: ${VERIFY_OUTPUT:-false}"
            echo "- **自動マージ**: ${AUTO_MERGE:-false}"
            echo ""

            # 処理の成否と品質検証の状態は別々に表示する (ジョブの緑だけでは品質合格を意味しない)
            echo "### 📊 処理結果"
            case "${PROCESS_RESULT:-}" in
              success)
                echo "- 処理: ✅ 成功"
                echo "- **処理対象**: ${STATS_TOTAL}件"
                echo "- **成功**: ${STATS_SUCCEEDED}件"
                echo "- **失敗**: ${STATS_FAILED}件"
                echo "- **スキップ**: ${STATS_SKIPPED}件 (data/raw 配下でない指定)"
                ;;
              dry_run)
                echo "- 処理: 🧪 ドライラン (引数と data ディレクトリの存在のみ確認)"
                echo "- 対象ファイルの存在・変換・品質は未確認です。既存の stats.json は今回の結果ではないため表示しません"
                ;;
              failed)
                echo "- 処理: ❌ 失敗 (ワークフローログと data/logs/console_*.log を確認)"
                ;;
              *)
                echo "- 処理: ⚠️ 未完了 (処理ステップに到達していないか中断されました)"
                ;;
            esac
            echo ""

            echo "### 🔍 品質検証"
            case "${VALIDATION_STATUS:-}" in
              not_requested)
                echo "- 品質検証: 未実施 (verify_output=false)。ジョブの成功は品質未検証を意味します"
                ;;
              passed)
                echo "- 品質検証: ✅ 合格"
                ;;
              failed)
                echo "- 品質検証: ❌ 不合格。原因を確認するまで PR をマージしないでください"
                ;;
              error)
                echo "- 品質検証: ⚠️ 検証不能 (異常終了・レポート欠落/不正・検証0件・終了値とレポートの不一致)。原因を確認するまで PR をマージしないでください"
                ;;
              *)
                echo "- 品質検証: 未実施 (ドライランまたは処理が成功しなかったため実行していません)"
                ;;
            esac
            echo ""

            if [ "$HAS_CHANGES" = "true" ]; then
              echo "### ✅ 変更"
              echo "#### 処理済みデータ（data/processed/）"
              if [ "${NEW_PROCESSED_FILES:-0}" -gt 0 ] && [ "${MODIFIED_PROCESSED_FILES:-0}" -gt 0 ]; then
                echo "- **新規**: ${NEW_PROCESSED_FILES}件"
                echo "- **更新**: ${MODIFIED_PROCESSED_FILES}件"
              elif [ "${NEW_PROCESSED_FILES:-0}" -gt 0 ]; then
                echo "- **新規**: ${NEW_PROCESSED_FILES}件"
              elif [ "${MODIFIED_PROCESSED_FILES:-0}" -gt 0 ]; then
                echo "- **更新**: ${MODIFIED_PROCESSED_FILES}件"
              else
                echo "- 変更なし"
              fi

              echo ""
              echo "**合計**: ${CSV_FILES:-0}ファイル"

              if [ -n "$PR_URL" ]; then
                echo ""
                echo "- **Pull Request**: $PR_URL"
              fi
            else
              echo "### ℹ️ 変更なし"
            fi

            echo ""
            echo "### 📁 ストレージ情報"
            echo '```'
            echo "生データ: $(du -sh data/raw/ 2>/dev/null | cut -f1 || echo 'N/A')"
            echo "処理済み: $(du -sh data/processed/ 2>/dev/null | cut -f1 || echo 'N/A')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 品質検証の不合格/検証不能は調査用 PR とサマリーを残した後でジョブ結論に反映する。
      # 処理エラー通知 (Create issue on error) とは区別するため、最後の step に置く
      - name: Enforce validation result
        if: env.VERIFY_OUTPUT == 'true' && env.PROCESS_RESULT == 'success'
        run: |
          if [ "${VALIDATION_STATUS:-}" != "passed" ]; then
            echo "::error title=Output validation did not pass::verify_output=true の品質検証結果は ${VALIDATION_STATUS:-unknown} でした。調査用 PR と検証レポートを確認し、原因を確認するまでマージしないでください"
            exit 1
          fi
          echo "✅ 品質検証: 合格"
