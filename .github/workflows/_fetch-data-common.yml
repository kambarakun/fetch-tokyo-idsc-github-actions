name: 🔄 Common Fetch Data Workflow

on:
  workflow_call:
    inputs:
      workflow_type:
        description: "ワークフロータイプ"
        required: true
        type: string # "manual" | "weekly" | "daily"
      workflow_display_name:
        description: "ワークフロー表示名"
        required: true
        type: string
      mode:
        description: "データ収集モード"
        required: false
        type: string
        default: "full" # "incremental" | "full" | "force"
      data_types:
        description: "取得するデータ種別 (カンマ区切り)"
        required: false
        type: string
        default: ""
      start_year:
        description: "開始年"
        required: false
        type: string
        default: ""
      end_year:
        description: "終了年"
        required: false
        type: string
        default: ""
      target_weeks:
        description: "対象週 (カンマ区切り)"
        required: false
        type: string
        default: ""
      target_months:
        description: "対象月 (カンマ区切り)"
        required: false
        type: string
        default: ""
      verify_lockfile:
        description: "uv.lockが最新かチェック"
        required: false
        type: boolean
        default: false
      verify_continuity:
        description: "データ連続性を検証"
        required: false
        type: boolean
        default: false
      validate_before:
        description: "データ取得前に既存データを検証"
        required: false
        type: boolean
        default: false
      validate_after:
        description: "データ取得後に検証"
        required: false
        type: boolean
        default: false
      check_previous_year:
        description: "前年のデータもチェック (1月のみ推奨)"
        required: false
        type: boolean
        default: false
      continue_on_failure:
        description: "処理失敗時も継続"
        required: false
        type: boolean
        default: false
      auto_merge:
        description: "PR自動マージを有効化"
        required: false
        type: boolean
        default: false
      force_merge_on_failure:
        description: "処理失敗時も強制マージ"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "テスト実行 (データ取得のみでコミットしない)"
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: "タイムアウト時間 (分)"
        required: false
        type: number
        default: 180
      log_retention_days:
        description: "ログ保存期間 (日)"
        required: false
        type: number
        default: 30

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Verify lockfile is up-to-date
        if: inputs.verify_lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create directories
        run: |
          mkdir -p data/raw/.metadata data/processed data/logs data/quarantine
          mkdir -p config

      - name: Set environment variables
        run: |
          # POSIX準拠の日付計算を使用
          CURRENT_YEAR=$(date +'%Y')
          PREVIOUS_YEAR=$((CURRENT_YEAR - 1))

          {
            echo "FETCH_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')"
            echo "CURRENT_DATE=$(date +'%Y-%m-%d')"
            echo "CURRENT_YEAR=$CURRENT_YEAR"
            echo "PREVIOUS_YEAR=$PREVIOUS_YEAR"
            echo "CURRENT_MONTH=$(date +'%m')"
            echo "CURRENT_WEEK=$(date +'%V')"
            echo "GITHUB_RUN_ID=${{ github.run_id }}"
          } >> "$GITHUB_ENV"

      - name: Prepare fetch parameters
        id: params
        run: |
          # 入力パラメータの処理
          MODE="${{ inputs.mode }}"
          START_YEAR="${{ inputs.start_year }}"
          END_YEAR="${{ inputs.end_year }}"
          CHECK_PREVIOUS_YEAR="${{ inputs.check_previous_year }}"
          DRY_RUN="${{ inputs.dry_run }}"

          # workflow_type別のデフォルト値設定
          case "${{ inputs.workflow_type }}" in
            manual)
              # 手動実行: 入力値をそのまま使用
              if [ -z "$START_YEAR" ]; then
                START_YEAR="$CURRENT_YEAR"
              fi
              if [ -z "$END_YEAR" ]; then
                END_YEAR="$CURRENT_YEAR"
              fi
              ;;
            weekly)
              # 週次実行: 前年チェックの自動判定
              if [ "$CHECK_PREVIOUS_YEAR" = "true" ] || [ "$CURRENT_MONTH" = "01" ]; then
                START_YEAR="$PREVIOUS_YEAR"
                echo "ℹ️ January detected or previous year check enabled: Including $PREVIOUS_YEAR"
              else
                START_YEAR="$CURRENT_YEAR"
              fi
              END_YEAR="$CURRENT_YEAR"
              ;;
            daily)
              # 日次実行: start_yearは呼び出し側で設定済み
              if [ -z "$START_YEAR" ]; then
                START_YEAR="$CURRENT_YEAR"
              fi
              END_YEAR="$CURRENT_YEAR"
              ;;
          esac

          # 環境変数として設定
          {
            echo "START_YEAR=$START_YEAR"
            echo "END_YEAR=$END_YEAR"
            echo "MODE=$MODE"
            echo "CHECK_PREVIOUS_YEAR=$CHECK_PREVIOUS_YEAR"
            echo "DRY_RUN=$DRY_RUN"
          } >> "$GITHUB_ENV"

          echo "${{ inputs.workflow_display_name }} parameters:"
          echo "  Start year: $START_YEAR"
          echo "  End year: $END_YEAR"
          echo "  Current week: $CURRENT_WEEK"
          echo "  Collection mode: $MODE"
          echo "  Check previous year: $CHECK_PREVIOUS_YEAR"
          echo "  Dry run: $DRY_RUN"

      - name: Validate existing data before fetch
        id: validate-before
        if: inputs.validate_before
        run: |
          echo "データ取得前の既存データ検証..."
          # data/raw ディレクトリの存在を最初に確認 (find は非存在 dir で exit 1)
          # GitHub Actions の `run:` は bash -eo pipefail で動作するため、
          # `find /missing | wc -l` は pipefail で step 全体を abort してしまう
          CSV_COUNT=0
          if [ -d "data/raw" ]; then
            # find で安全に csv ファイル数をカウント (ls -A よりノイズに強い)
            CSV_COUNT=$(find data/raw -maxdepth 1 -name '*.csv' -type f | wc -l)
          fi
          if [ "$CSV_COUNT" -gt 0 ]; then
            VALIDATION_REPORT_BEFORE="data/logs/validation_before_${FETCH_TIMESTAMP}.json"
            if uv run validate-data data/raw --pattern "*.csv" --output "$VALIDATION_REPORT_BEFORE"; then
              echo "✅ 事前データ検証成功"
              echo "VALIDATION_BEFORE_SUCCESS=true" >> "$GITHUB_ENV"
            else
              echo "❌ 事前データ検証失敗"
              echo "VALIDATION_BEFORE_SUCCESS=false" >> "$GITHUB_ENV"

              # 検証レポートの内容を表示
              if [ -f "$VALIDATION_REPORT_BEFORE" ]; then
                echo "検証レポート:"
                jq .summary "$VALIDATION_REPORT_BEFORE" || echo "⚠️ レポート解析に失敗しました"
              fi

              # 検証失敗でもフェッチは続行 (既存データの問題を新規データで上書きする可能性もある)
            fi
          else
            echo "既存データなし - 検証スキップ"
            echo "VALIDATION_BEFORE_SUCCESS=true" >> "$GITHUB_ENV"
          fi

      - name: Fetch epidemic data
        id: fetch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # パイプラインの終了コードを正しく伝播 (pipefailオプション)
          set -o pipefail

          # ログファイル名の決定 (workflow_typeベース)
          case "${{ inputs.workflow_type }}" in
            manual) LOG_PREFIX="fetch" ;;
            weekly) LOG_PREFIX="weekly" ;;
            daily)  LOG_PREFIX="daily" ;;
          esac

          echo "Starting ${{ inputs.workflow_display_name }} at $FETCH_TIMESTAMP"

          # コマンドの構築
          FETCH_CMD=(uv run fetch-data)

          # 年範囲の指定
          FETCH_CMD+=(--start-year "$START_YEAR")
          FETCH_CMD+=(--end-year "$END_YEAR")

          # モードを指定
          FETCH_CMD+=(--mode "$MODE")

          # データ種別の指定 (指定された場合のみ)
          if [ -n "${{ inputs.data_types }}" ]; then
            FETCH_CMD+=(--data-types "${{ inputs.data_types }}")
          fi

          # 対象週の指定 (指定された場合のみ)
          if [ -n "${{ inputs.target_weeks }}" ]; then
            FETCH_CMD+=(--target-weeks "${{ inputs.target_weeks }}")
          fi

          # 対象月の指定 (指定された場合のみ)
          if [ -n "${{ inputs.target_months }}" ]; then
            FETCH_CMD+=(--target-months "${{ inputs.target_months }}")
          fi

          # DRY_RUNがtrueの場合
          if [ "$DRY_RUN" = "true" ]; then
            FETCH_CMD+=(--dry-run)
          fi

          FETCH_CMD+=(--log-file "data/logs/${LOG_PREFIX}_${FETCH_TIMESTAMP}.log")

          echo "Executing: ${FETCH_CMD[*]}"

          # メインスクリプトの実行
          # NOTE:
          # - pipefail: パイプライン全体の失敗を検出
          # - PIPESTATUS: 各コマンドの終了コード配列
          # PIPESTATUSは次のコマンド実行で上書きされるため、実行直後に退避する
          set +e
          "${FETCH_CMD[@]}" 2>&1 | tee "data/logs/console_${LOG_PREFIX}_${FETCH_TIMESTAMP}.log"
          PIPE_EXIT_CODES=("${PIPESTATUS[@]}")
          set -e

          FETCH_EXIT_CODE="${PIPE_EXIT_CODES[0]}"
          if [ "${FETCH_EXIT_CODE}" -eq 0 ]; then
            FETCH_STATUS="success"
            echo "✅ データ取得: 成功"
          else
            FETCH_STATUS="failed"
            echo "❌ データ取得: 失敗 (exit code: ${FETCH_EXIT_CODE})"
          fi

          # 実行結果を保存
          {
            echo "FETCH_RESULT=${FETCH_EXIT_CODE}"
            echo "FETCH_STATUS=${FETCH_STATUS}"
            echo "FETCH_CONTINUED_REASON=none"
          } >> "$GITHUB_ENV"

      - name: Fetch result gate
        id: fetch-gate
        if: env.FETCH_STATUS == 'failed'
        shell: bash
        run: |
          echo "⚠️ データ取得に失敗しました (exit code: ${FETCH_RESULT})"
          echo "::error title=Data fetch failed::fetch-data exited with code ${FETCH_RESULT}; automatic merge will be blocked unless explicitly overridden"

          # 失敗時の動作制御
          # 真理値表:
          # continue_on_failure | force_merge_on_failure | 動作
          # -------------------|----------------------|------
          # true               | (any)                | 継続
          # false              | true                 | 継続（警告）
          # false              | false                | 終了（exit 1）
          if [ "${{ inputs.continue_on_failure }}" = "true" ]; then
            REASON="continue_on_failure=true により継続"
            echo "⚠️ 警告: ${REASON}"
            echo "FETCH_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
          else
            if [ "${{ inputs.force_merge_on_failure }}" = "true" ]; then
              REASON="force_merge_on_failure=true により継続"
              echo "⚠️ 警告: ${REASON}"
              echo "FETCH_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
            else
              echo "🚫 fetch失敗のためジョブを終了します。"
              echo "::error::Fetch failed with exit code ${FETCH_RESULT}"
              exit 1
            fi
          fi

      - name: Process epidemic data
        id: process
        if: inputs.dry_run != true
        shell: bash
        run: |
          # パイプラインの終了コードを正しく伝播 (pipefailオプション)
          set -o pipefail

          echo "Starting data processing at $(date +'%Y-%m-%d %H:%M:%S')"

          # 変更されたdata/raw/*.csvファイルのみを取得 (working treeから)
          # git statusを使用してunstaged/staged両方の変更を検出
          # POSIX準拠の空白クラス [[:space:]] を使用
          mapfile -t CHANGED_RAW_FILES < <(git status --porcelain | grep -E '^[[:space:]]*[AM].*data/raw/.*\.csv$' | sed 's/^...//')

          if [ ${#CHANGED_RAW_FILES[@]} -eq 0 ]; then
            echo "ℹ️ 処理対象のrawファイルがありません。処理をスキップします。"
            {
              echo "PROCESS_RESULT=skipped"
              echo "PROCESS_CONTINUED_REASON=none"
            } >> "$GITHUB_ENV"
          else
            # 変更ファイル数を表示
            FILE_COUNT=${#CHANGED_RAW_FILES[@]}
            echo "📊 処理対象: ${FILE_COUNT}ファイル"
            for file in "${CHANGED_RAW_FILES[@]}"; do
              echo "  - $file"
            done

            # データ処理の実行 (変更されたファイルのみ)
            # 配列を安全に展開してスペースを含むファイル名にも対応
            # 注: set -o pipefailにより、パイプ内のPythonスクリプトの終了コードが正しく伝播される
            if uv run process-data --files "${CHANGED_RAW_FILES[@]}" 2>&1 | tee "data/logs/process_${FETCH_TIMESTAMP}.log"; then
              echo "✅ データ処理: 成功"
              {
                echo "PROCESS_RESULT=success"
                echo "PROCESS_CONTINUED_REASON=none"
              } >> "$GITHUB_ENV"

              # stats.jsonから処理結果を抽出
              if [ -f "data/processed/stats.json" ]; then
                # JSON形式を事前検証 (jq -eで検証し、不正な場合は警告)
                if ! jq -e . data/processed/stats.json >/dev/null 2>&1; then
                  echo "⚠️ 警告: stats.jsonが不正なJSON形式です。デフォルト値を使用します。"
                  STATS_TOTAL="0"
                  STATS_SUCCEEDED="0"
                  STATS_FAILED="0"
                else
                  STATS_TOTAL=$(jq -r '.total' data/processed/stats.json 2>/dev/null || echo "0")
                  STATS_SUCCEEDED=$(jq -r '.succeeded' data/processed/stats.json 2>/dev/null || echo "0")
                  STATS_FAILED=$(jq -r '.failed' data/processed/stats.json 2>/dev/null || echo "0")
                fi

                # 環境変数を一括設定 (shellcheck SC2129対応)
                {
                  echo "STATS_TOTAL=${STATS_TOTAL}"
                  echo "STATS_SUCCEEDED=${STATS_SUCCEEDED}"
                  echo "STATS_FAILED=${STATS_FAILED}"
                } >> "$GITHUB_ENV"

                echo "📊 処理統計: 成功=${STATS_SUCCEEDED}/${STATS_TOTAL}, 失敗=${STATS_FAILED}"

                # エラー詳細を表示 (最大5件)
                ERROR_COUNT=$(jq -r '.errors | length' data/processed/stats.json 2>/dev/null || echo "0")
                if [ "${ERROR_COUNT}" -gt 0 ]; then
                  echo "⚠️ エラー詳細:"
                  jq -r '.errors[:5] | .[] | "  - \(.file): \(.error)"' data/processed/stats.json 2>/dev/null || echo "  エラー詳細の取得に失敗しました"
                  if [ "${ERROR_COUNT}" -gt 5 ]; then
                    echo "  ... 他$((ERROR_COUNT - 5))件のエラー"
                  fi
                fi
              fi
            else
              echo "❌ データ処理: 失敗"
              {
                echo "PROCESS_RESULT=failed"
                echo "PROCESS_CONTINUED_REASON=none"
              } >> "$GITHUB_ENV"

              # 処理失敗時の動作制御
              # 真理値表:
              # continue_on_failure | force_merge_on_failure | 動作
              # -------------------|----------------------|------
              # true               | (any)                | 継続
              # false              | true                 | 継続（警告）
              # false              | false                | 終了（exit 1）
              if [ "${{ inputs.continue_on_failure }}" = "true" ]; then
                REASON="continue_on_failure=true により継続"
                echo "⚠️ 警告: データ処理に失敗しましたが、${REASON}します。"
                echo "PROCESS_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
              else
                # force_merge_on_failureがfalseの場合は終了
                if [ "${{ inputs.force_merge_on_failure }}" = "false" ]; then
                  exit 1
                else
                  REASON="force_merge_on_failure=true により継続"
                  echo "⚠️ 警告: データ処理に失敗しましたが、${REASON}します。"
                  echo "PROCESS_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
                fi
              fi
            fi
          fi

      - name: Create issue on processing failure
        id: create_issue
        if: env.PROCESS_RESULT == 'failed'
        shell: bash
        run: |
          echo "📝 処理失敗のGitHub Issueを作成します..."

          # セキュリティ: 環境変数をサニタイズ (インジェクション対策)
          # 英数字、ハイフン、アンダースコア、スラッシュのみを許可
          SAFE_ACTOR=$(echo "${GITHUB_ACTOR}" | tr -cd '[:alnum:]-_')
          SAFE_REF=$(echo "${GITHUB_REF}" | tr -cd '[:alnum:]-_/')
          SAFE_SHA=$(echo "${GITHUB_SHA:0:7}" | tr -cd '[:alnum:]')

          ISSUE_TITLE="[自動/${{ inputs.workflow_type }}] データ処理失敗: $(date +'%Y-%m-%d %H:%M')"
          ISSUE_BODY="データ処理ステップが失敗しました (${{ inputs.workflow_display_name }})。

          発生日時: $(date +'%Y-%m-%d %H:%M:%S %Z')
          ワークフロー実行: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          コミット: ${SAFE_SHA}
          Branch: ${SAFE_REF}
          Actor: ${SAFE_ACTOR}

          対応方法:
          1. ワークフローログで具体的なエラーメッセージを確認
          2. 処理ログファイル: data/logs/process_${FETCH_TIMESTAMP}.log
          3. 問題を修正後、手動で再実行してください"

          gh issue create \
            --title "${ISSUE_TITLE}" \
            --body "${ISSUE_BODY}" \
            --label "bug,automated,data-processing,${{ inputs.workflow_type }}" \
            --assignee "${SAFE_ACTOR}" || echo "⚠️ Issue作成に失敗しましたが、処理を継続します"

      - name: Validate fetched data
        id: validate-after
        if: inputs.validate_after && inputs.dry_run != true
        run: |
          echo "取得したデータの検証..."
          VALIDATION_REPORT="data/logs/validation_${FETCH_TIMESTAMP}.json"

          if uv run validate-data data/raw --pattern "*.csv" --output "$VALIDATION_REPORT"; then
            echo "✅ データ検証成功"
            echo "VALIDATION_SUCCESS=true" >> "$GITHUB_ENV"
          else
            echo "❌ データ検証失敗"
            echo "VALIDATION_SUCCESS=false" >> "$GITHUB_ENV"

            # 検証レポートの内容を表示
            if [ -f "$VALIDATION_REPORT" ]; then
              echo "検証レポート:"
              jq .summary "$VALIDATION_REPORT" || echo "⚠️ レポート解析に失敗しました"
            fi

            # 検証失敗でもPR作成は続行 (レビューで確認)
          fi

      - name: Verify data continuity
        if: inputs.verify_continuity && inputs.dry_run != true
        run: |
          echo "データ連続性を検証しています..."
          CONTINUITY_REPORT="$RUNNER_TEMP/continuity_${FETCH_TIMESTAMP}.json"
          CONTINUITY_VALID=false

          if uv run check-missing data/raw \
            --start-year "$START_YEAR" \
            --end-year "$END_YEAR" \
            --as-of "$CURRENT_DATE" \
            --format json \
            --output "$CONTINUITY_REPORT"; then
            CONTINUITY_VALID=true
            echo "✅ データ連続性検証成功"
          else
            echo "❌ データ連続性検証失敗"
            echo "::error title=Data continuity validation failed::Missing periods were detected; automatic merge will be blocked"
          fi

          echo "CONTINUITY_VALID=$CONTINUITY_VALID" >> "$GITHUB_ENV"
          if [ -f "$CONTINUITY_REPORT" ]; then
            jq .summary "$CONTINUITY_REPORT"
          fi

      - name: Generate visualization charts
        if: inputs.dry_run != true
        run: |
          echo "📈 感染動向グラフを生成しています..."
          uv run python scripts/generate_charts.py

          # グラフファイルをステージング
          if ! git diff --quiet docs/images/; then
            git add docs/images/
            echo "✅ Charts updated"
          fi

      - name: Update README statistics
        if: inputs.dry_run != true
        run: |
          echo "📊 README統計情報を更新しています..."
          uv run python scripts/update_readme_stats.py

          # 変更があればステージング
          if ! git diff --quiet README.md; then
            git add README.md
            echo "✅ README.md updated with latest statistics"
          else
            echo "ℹ️ No README changes needed"
          fi

      - name: Check for changes
        id: changes
        if: inputs.dry_run != true
        run: |
          # 変更の有無をチェック
          git add data/

          if git diff --cached --quiet; then
            echo "No changes detected"
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "Changes detected"
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

            # 新規ファイルと変更ファイルを分けて集計 (他のワークフローと統一)
            # POSIX準拠の空白クラス [[:space:]] と拡張正規表現 -E を使用

            # 新規rawファイル数 (data/raw/*.csv)
            NEW_RAW_FILES=$(git diff --cached --name-status | grep -cE '^A[[:space:]]+data/raw/[^/]*\.csv$' | tr -d ' ' || echo "0")

            # 変更されたrawファイル数
            MODIFIED_RAW_FILES=$(git diff --cached --name-status | grep -cE '^M[[:space:]]+data/raw/[^/]*\.csv$' | tr -d ' ' || echo "0")

            # 処理済みファイル数 (data/processed/normalized_*.csv)
            NEW_PROCESSED_FILES=$(git diff --cached --name-status | grep -cE '^A[[:space:]]+data/processed/normalized_.*\.csv$' | tr -d ' ' || echo "0")

            # 合計CSVファイル数
            TOTAL_CSV_FILES=$(git diff --cached --name-only | grep -c '\.csv$' | tr -d ' ' || echo "0")

            # 空文字列や非数値の場合のフォールバック
            if ! [[ "$NEW_RAW_FILES" =~ ^[0-9]+$ ]]; then
              NEW_RAW_FILES="0"
            fi
            if ! [[ "$MODIFIED_RAW_FILES" =~ ^[0-9]+$ ]]; then
              MODIFIED_RAW_FILES="0"
            fi
            if ! [[ "$NEW_PROCESSED_FILES" =~ ^[0-9]+$ ]]; then
              NEW_PROCESSED_FILES="0"
            fi
            if ! [[ "$TOTAL_CSV_FILES" =~ ^[0-9]+$ ]]; then
              TOTAL_CSV_FILES="0"
            fi

            # 環境変数を設定
            # サマリーとPR作成スクリプトの両方で使用できるよう、2つの命名規則で設定
            NEW_CSV_FILES=$NEW_RAW_FILES
            MODIFIED_CSV_FILES=$MODIFIED_RAW_FILES

            {
              echo "NEW_CSV_FILES=$NEW_CSV_FILES"
              echo "MODIFIED_CSV_FILES=$MODIFIED_CSV_FILES"
              echo "NEW_PROCESSED_FILES=$NEW_PROCESSED_FILES"
              echo "CSV_FILES=$TOTAL_CSV_FILES"

              # サマリー用の変数名も設定 (後方互換性)
              echo "NEW_FILES=$NEW_CSV_FILES"
              echo "MODIFIED_FILES=$MODIFIED_CSV_FILES"
              echo "CHANGED_FILES=$TOTAL_CSV_FILES"
            } >> "$GITHUB_ENV"

            echo "📊 変更統計:"
            echo "  - 新規rawファイル: $NEW_RAW_FILES"
            echo "  - 更新rawファイル: $MODIFIED_RAW_FILES"
            echo "  - 処理済みファイル: $NEW_PROCESSED_FILES"
            echo "  - 合計CSVファイル: $TOTAL_CSV_FILES"
          fi

      - name: Evaluate auto-merge gate
        if: inputs.dry_run != true
        shell: bash
        env:
          AUTO_MERGE: ${{ inputs.auto_merge }}
          FORCE_MERGE_ON_FAILURE: ${{ inputs.force_merge_on_failure }}
          FETCH_STATUS: ${{ env.FETCH_STATUS }}
          PROCESS_RESULT: ${{ env.PROCESS_RESULT }}
          VERIFY_CONTINUITY: ${{ inputs.verify_continuity }}
          CONTINUITY_VALID: ${{ env.CONTINUITY_VALID }}
          VALIDATION_BEFORE_SUCCESS: ${{ env.VALIDATION_BEFORE_SUCCESS }}
          VALIDATION_SUCCESS: ${{ env.VALIDATION_SUCCESS }}
        run: |
          case "${{ inputs.workflow_type }}" in
            manual) WORKFLOW_NAME="fetch-data" ;;
            weekly) WORKFLOW_NAME="fetch-data-weekly" ;;
            daily)  WORKFLOW_NAME="fetch-data-daily" ;;
            *)      WORKFLOW_NAME="unknown" ;;
          esac

          source scripts/auto_merge_gate.sh
          evaluate_auto_merge_gate
          write_auto_merge_gate_env

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 共通スクリプトで使用する環境変数
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 詳細統計 (他のワークフローと統一)
          NEW_FILES: ${{ env.NEW_CSV_FILES }}
          MODIFIED_FILES: ${{ env.MODIFIED_CSV_FILES }}
          CHANGED_FILES: ${{ env.CSV_FILES }}
          NEW_PROCESSED_FILES: ${{ env.NEW_PROCESSED_FILES }}
          # auto_merge設定
          AUTO_MERGE: ${{ inputs.auto_merge }}
          FORCE_MERGE_ON_FAILURE: ${{ inputs.force_merge_on_failure }}
          FETCH_STATUS: ${{ env.FETCH_STATUS }}
          PROCESS_RESULT: ${{ env.PROCESS_RESULT }}
          FETCH_CONTINUED_REASON: ${{ env.FETCH_CONTINUED_REASON }}
          PROCESS_CONTINUED_REASON: ${{ env.PROCESS_CONTINUED_REASON }}
          VERIFY_CONTINUITY: ${{ inputs.verify_continuity }}
          CONTINUITY_VALID: ${{ env.CONTINUITY_VALID }}
          VALIDATION_BEFORE_SUCCESS: ${{ env.VALIDATION_BEFORE_SUCCESS }}
          VALIDATION_SUCCESS: ${{ env.VALIDATION_SUCCESS }}
          AUTO_MERGE_GATE_EVALUATED: ${{ env.AUTO_MERGE_GATE_EVALUATED }}
          AUTO_MERGE_REQUESTED: ${{ env.AUTO_MERGE_REQUESTED }}
          FORCE_MERGE: ${{ env.FORCE_MERGE }}
          FETCH_GATE_STATUS: ${{ env.FETCH_GATE_STATUS }}
          PROCESS_GATE_STATUS: ${{ env.PROCESS_GATE_STATUS }}
          VALIDATION_GATE_STATUS: ${{ env.VALIDATION_GATE_STATUS }}
          CONTINUITY_GATE_STATUS: ${{ env.CONTINUITY_GATE_STATUS }}
          AUTO_MERGE_GATE_STATUS: ${{ env.AUTO_MERGE_GATE_STATUS }}
          AUTO_MERGE_BLOCKERS: ${{ env.AUTO_MERGE_BLOCKERS }}
          AUTO_MERGE_OVERRIDE_USED: ${{ env.AUTO_MERGE_OVERRIDE_USED }}
          AUTO_MERGE_EFFECTIVE: ${{ env.AUTO_MERGE_EFFECTIVE }}
        run: |
          # workflow_type を create_pr.sh が認識する workflow_name 識別子へ変換する。
          # create_pr.sh はこの識別子でブランチ名・コミットメッセージ・自動マージ検証ゲートを分岐するため、
          # 旧来の "data-update-*" を渡すと全て default 分岐に落ち、ブランチ名二重化・検証ゲート無効化を招く。
          case "${{ inputs.workflow_type }}" in
            manual) WORKFLOW_NAME="fetch-data" ;;
            weekly) WORKFLOW_NAME="fetch-data-weekly" ;;
            daily)  WORKFLOW_NAME="fetch-data-daily" ;;
            *)      WORKFLOW_NAME="fetch-data" ;;
          esac

          # 共通スクリプトを呼び出し
          bash scripts/create_pr.sh "$WORKFLOW_NAME" "${{ inputs.workflow_display_name }}"

      - name: Create issue on error
        if: failure() && inputs.dry_run != true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issueBody = `## ${{ inputs.workflow_display_name }}エラー

            ${{ inputs.workflow_display_name }}処理でエラーが発生しました。

            ### エラー情報
            - **日時**: ${date}
            - **ワークフロー実行**: ${runUrl}
            - **開始年**: ${process.env.START_YEAR || 'N/A'}
            - **終了年**: ${process.env.END_YEAR || 'N/A'}
            - **モード**: ${process.env.MODE || 'N/A'}

            ### 対応方法
            1. 上記のワークフロー実行リンクからログを確認
            2. エラー内容を特定
            3. 必要に応じて手動で再実行

            ### 自動ラベル
            - ${{ inputs.workflow_type }}
            - data-collection
            - error
            - automated`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${{ inputs.workflow_type }}] データ取得エラー - ${date}`,
              body: issueBody,
              labels: ['${{ inputs.workflow_type }}', 'data-collection', 'error', 'automated']
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.workflow_type }}-logs-${{ env.FETCH_TIMESTAMP }}
          path: data/logs/
          retention-days: ${{ inputs.log_retention_days }}

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## 📊 ${{ inputs.workflow_display_name }}サマリー"
            echo ""
            echo "- **実行日時**: $CURRENT_DATE ${{ env.FETCH_TIMESTAMP }}"
            echo "- **対象期間**: $START_YEAR - $END_YEAR"
            echo "- **現在の週**: 第${CURRENT_WEEK}週"
            echo "- **収集モード**: ${MODE}"
            echo "- **ドライラン**: ${DRY_RUN:-false}"
            echo ""
            echo "### 🔄 データ取得結果"
            echo "- **取得ステータス**: ${FETCH_STATUS:-unknown}"
            echo "- **終了コード**: ${FETCH_RESULT:-N/A}"
            if [ -n "${FETCH_CONTINUED_REASON:-}" ] && [ "${FETCH_CONTINUED_REASON}" != "none" ]; then
              echo "- **継続理由**: ${FETCH_CONTINUED_REASON}"
            fi
            echo ""
            echo "### 🛡️ 自動マージゲート"
            echo "- **取得**: ${FETCH_GATE_STATUS:-not_evaluated}"
            echo "- **処理**: ${PROCESS_GATE_STATUS:-not_evaluated}"
            echo "- **検証**: ${VALIDATION_GATE_STATUS:-not_evaluated}"
            echo "- **連続性**: ${CONTINUITY_GATE_STATUS:-not_evaluated}"
            echo "- **ブロック理由**: ${AUTO_MERGE_BLOCKERS:-not_evaluated}"
            echo "- **判定**: ${AUTO_MERGE_GATE_STATUS:-not_evaluated}"
            echo "- **強制上書き要求**: ${{ inputs.force_merge_on_failure }}"
            echo "- **強制上書き適用**: ${AUTO_MERGE_OVERRIDE_USED:-false}"
            echo "- **取得失敗後の継続理由**: ${FETCH_CONTINUED_REASON:-none}"
            echo "- **処理失敗後の継続理由**: ${PROCESS_CONTINUED_REASON:-none}"
            echo ""

            if [ "$HAS_CHANGES" = "true" ]; then
              echo "### ✅ 変更検出"
              echo "- **総変更ファイル数**: $CHANGED_FILES"
              if [ -n "$NEW_FILES" ] && [ "$NEW_FILES" -gt 0 ]; then
                echo "- **新規ファイル**: $NEW_FILES"
              fi
              if [ -n "$MODIFIED_FILES" ] && [ "$MODIFIED_FILES" -gt 0 ]; then
                echo "- **更新ファイル**: $MODIFIED_FILES"
              fi
              if [ -n "$PR_URL" ]; then
                echo "- **Pull Request**: $PR_URL"
              fi
            else
              echo "### ℹ️ 変更なし"
              echo "${{ inputs.workflow_display_name }}で変更は検出されませんでした。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
