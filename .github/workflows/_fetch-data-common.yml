name: 🔄 Common Fetch Data Workflow

on:
  workflow_call:
    inputs:
      workflow_type:
        description: "ワークフロータイプ"
        required: true
        type: string # "manual" | "weekly" | "daily"
      workflow_display_name:
        description: "ワークフロー表示名"
        required: true
        type: string
      mode:
        description: "データ収集モード"
        required: false
        type: string
        default: "full" # "incremental" | "full" | "force"
      data_types:
        description: "取得するデータ種別 (カンマ区切り)"
        required: false
        type: string
        default: ""
      start_year:
        description: "開始年"
        required: false
        type: string
        default: ""
      end_year:
        description: "終了年"
        required: false
        type: string
        default: ""
      target_weeks:
        description: "対象週 (カンマ区切り)"
        required: false
        type: string
        default: ""
      target_months:
        description: "対象月 (カンマ区切り)"
        required: false
        type: string
        default: ""
      verify_continuity:
        description: "データ連続性を検証"
        required: false
        type: boolean
        default: false
      validate_before:
        description: "データ取得前に既存データを検証"
        required: false
        type: boolean
        default: false
      validate_after:
        description: "データ取得後に検証"
        required: false
        type: boolean
        default: false
      check_previous_year:
        description: "前年のデータもチェック (1月のみ推奨)"
        required: false
        type: boolean
        default: false
      continue_on_failure:
        description: "処理失敗時も継続"
        required: false
        type: boolean
        default: false
      auto_merge:
        description: "PR自動マージを有効化"
        required: false
        type: boolean
        default: false
      force_merge_on_failure:
        description: "処理失敗時も強制マージ"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "テスト実行 (データ取得のみでコミットしない)"
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: "タイムアウト時間 (分)"
        required: false
        type: number
        default: 180
      log_retention_days:
        description: "ログ保存期間 (日)"
        required: false
        type: number
        default: 30

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # run: blocks read inputs only through env, never through ${{ }} expansion (issue #733)
    env:
      WORKFLOW_TYPE: ${{ inputs.workflow_type }}
      WORKFLOW_DISPLAY_NAME: ${{ inputs.workflow_display_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv の pin は .tool-versions に置く (issue #681): 未指定だと pyproject/uv.toml -> latest の順で解決される
          version-file: .tool-versions
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      # --all-extras: Validate metadata against JSON Schema imports jsonschema, which only the dev extra provides
      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create directories
        run: |
          mkdir -p data/raw/.metadata data/processed data/logs data/quarantine
          mkdir -p config

      - name: Set environment variables
        run: |
          # POSIX準拠の日付計算を使用
          CURRENT_YEAR=$(TZ=Asia/Tokyo date +'%Y')
          PREVIOUS_YEAR=$((CURRENT_YEAR - 1))

          {
            echo "FETCH_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')"
            echo "CURRENT_DATE=$(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            echo "CURRENT_YEAR=$CURRENT_YEAR"
            echo "PREVIOUS_YEAR=$PREVIOUS_YEAR"
            echo "CURRENT_MONTH=$(TZ=Asia/Tokyo date +'%m')"
            echo "CURRENT_WEEK=$(TZ=Asia/Tokyo date +'%V')"
            echo "GITHUB_RUN_ID=${{ github.run_id }}"
          } >> "$GITHUB_ENV"

      - name: Prepare fetch parameters
        id: params
        # Unvalidated inputs live only here as RAW_*; GITHUB_ENV receives the validated values (issue #733)
        env:
          RAW_MODE: ${{ inputs.mode }}
          RAW_START_YEAR: ${{ inputs.start_year }}
          RAW_END_YEAR: ${{ inputs.end_year }}
          RAW_DATA_TYPES: ${{ inputs.data_types }}
          RAW_TARGET_WEEKS: ${{ inputs.target_weeks }}
          RAW_TARGET_MONTHS: ${{ inputs.target_months }}
          RAW_CHECK_PREVIOUS_YEAR: ${{ inputs.check_previous_year }}
          RAW_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # 入力の形式検証 (fail-closed)。メッセージには値そのものを出さない (ワークフローコマンド注入対策)
          invalid_input() {
            echo "::error title=Invalid workflow input::$1"
            exit 1
          }
          # Each listed number must be in [min, max]; 10# keeps 08/09 decimal.
          check_number_list() {
            local name="$1" value="$2" min="$3" max="$4" item
            local list_re='^[0-9]{1,2}(,[0-9]{1,2})*$'
            [ -z "$value" ] && return 0
            [[ $value =~ $list_re ]] || invalid_input "${name} must be comma-separated numbers ${min}-${max}"
            for item in ${value//,/ }; do
              if [ $((10#$item)) -lt "$min" ] || [ $((10#$item)) -gt "$max" ]; then
                invalid_input "${name} must be comma-separated numbers ${min}-${max}"
              fi
            done
          }
          year_re='^[0-9]{4}$'
          data_types_re='^[a-z_]+(,[a-z_]+)*$'

          case "$WORKFLOW_TYPE" in
            manual | weekly | daily) ;;
            *) invalid_input "workflow_type must be manual, weekly or daily" ;;
          esac
          case "$RAW_MODE" in
            incremental | full | force) ;;
            *) invalid_input "mode must be incremental, full or force" ;;
          esac
          for pair in "check_previous_year:$RAW_CHECK_PREVIOUS_YEAR" "dry_run:$RAW_DRY_RUN"; do
            case "${pair#*:}" in
              true | false) ;;
              *) invalid_input "${pair%%:*} must be true or false" ;;
            esac
          done
          if [ -n "$RAW_START_YEAR" ] && ! [[ $RAW_START_YEAR =~ $year_re ]]; then
            invalid_input "start_year must be empty or a 4-digit year"
          fi
          if [ -n "$RAW_END_YEAR" ] && ! [[ $RAW_END_YEAR =~ $year_re ]]; then
            invalid_input "end_year must be empty or a 4-digit year"
          fi
          if [ -n "$RAW_DATA_TYPES" ] && ! [[ $RAW_DATA_TYPES =~ $data_types_re ]]; then
            invalid_input "data_types must be empty or comma-separated lowercase data type names"
          fi
          check_number_list target_weeks "$RAW_TARGET_WEEKS" 1 53
          check_number_list target_months "$RAW_TARGET_MONTHS" 1 12
          # full/incremental skip existing files, and target_weeks does not narrow monthly types,
          # so a manual single-period repair needs force mode and explicit data types.
          if [ "$WORKFLOW_TYPE" = "manual" ] && [ -n "$RAW_TARGET_WEEKS$RAW_TARGET_MONTHS" ]; then
            if [ "$RAW_MODE" != "force" ] || [ -z "$RAW_DATA_TYPES" ]; then
              invalid_input "target_weeks/target_months require mode=force and data_types"
            fi
          fi

          MODE="$RAW_MODE"
          START_YEAR="$RAW_START_YEAR"
          END_YEAR="$RAW_END_YEAR"
          DATA_TYPES="$RAW_DATA_TYPES"
          TARGET_WEEKS="$RAW_TARGET_WEEKS"
          TARGET_MONTHS="$RAW_TARGET_MONTHS"
          CHECK_PREVIOUS_YEAR="$RAW_CHECK_PREVIOUS_YEAR"
          DRY_RUN="$RAW_DRY_RUN"

          # workflow_type別のデフォルト値設定
          case "$WORKFLOW_TYPE" in
            manual)
              # 手動実行: 入力値をそのまま使用
              if [ -z "$START_YEAR" ]; then
                START_YEAR="$CURRENT_YEAR"
              fi
              if [ -z "$END_YEAR" ]; then
                END_YEAR="$CURRENT_YEAR"
              fi
              ;;
            weekly)
              # 週次実行: 前年チェックの自動判定
              if [ "$CHECK_PREVIOUS_YEAR" = "true" ] || [ "$CURRENT_MONTH" = "01" ]; then
                START_YEAR="$PREVIOUS_YEAR"
                echo "ℹ️ January detected or previous year check enabled: Including $PREVIOUS_YEAR"
              else
                START_YEAR="$CURRENT_YEAR"
              fi
              END_YEAR="$CURRENT_YEAR"
              ;;
            daily)
              # 日次実行: start_yearは呼び出し側で設定済み
              if [ -z "$START_YEAR" ]; then
                START_YEAR="$CURRENT_YEAR"
              fi
              END_YEAR="$CURRENT_YEAR"
              ;;
          esac

          # 環境変数として設定
          {
            echo "START_YEAR=$START_YEAR"
            echo "END_YEAR=$END_YEAR"
            echo "MODE=$MODE"
            echo "DATA_TYPES=$DATA_TYPES"
            echo "TARGET_WEEKS=$TARGET_WEEKS"
            echo "TARGET_MONTHS=$TARGET_MONTHS"
            echo "CHECK_PREVIOUS_YEAR=$CHECK_PREVIOUS_YEAR"
            echo "DRY_RUN=$DRY_RUN"
          } >> "$GITHUB_ENV"

          echo "${WORKFLOW_DISPLAY_NAME} parameters:"
          echo "  Start year: $START_YEAR"
          echo "  End year: $END_YEAR"
          echo "  Current week: $CURRENT_WEEK"
          echo "  Collection mode: $MODE"
          echo "  Data types: ${DATA_TYPES:-all}"
          echo "  Target weeks: ${TARGET_WEEKS:-all}"
          echo "  Target months: ${TARGET_MONTHS:-all}"
          echo "  Check previous year: $CHECK_PREVIOUS_YEAR"
          echo "  Dry run: $DRY_RUN"

      - name: Validate existing data before fetch
        id: validate-before
        if: inputs.validate_before
        run: |
          echo "データ取得前の既存データ検証..."
          # data/raw ディレクトリの存在を最初に確認 (find は非存在 dir で exit 1)
          # GitHub Actions の `run:` は bash -eo pipefail で動作するため、
          # `find /missing | wc -l` は pipefail で step 全体を abort してしまう
          CSV_COUNT=0
          if [ -d "data/raw" ]; then
            # find で安全に csv ファイル数をカウント (ls -A よりノイズに強い)
            CSV_COUNT=$(find data/raw -maxdepth 1 -name '*.csv' -type f | wc -l)
          fi
          if [ "$CSV_COUNT" -gt 0 ]; then
            VALIDATION_REPORT_BEFORE="data/logs/validation_before_${FETCH_TIMESTAMP}.json"
            if uv run --locked validate-data data/raw --pattern "*.csv" --output "$VALIDATION_REPORT_BEFORE"; then
              echo "✅ 事前データ検証成功"
              echo "VALIDATION_BEFORE_SUCCESS=true" >> "$GITHUB_ENV"
            else
              echo "❌ 事前データ検証失敗"
              echo "VALIDATION_BEFORE_SUCCESS=false" >> "$GITHUB_ENV"

              # 検証レポートの内容を表示
              if [ -f "$VALIDATION_REPORT_BEFORE" ]; then
                echo "検証レポート:"
                jq .summary "$VALIDATION_REPORT_BEFORE" || echo "⚠️ レポート解析に失敗しました"
              fi

              # 検証失敗でもフェッチは続行 (既存データの問題を新規データで上書きする可能性もある)
            fi
          else
            echo "既存データなし - 検証スキップ"
            echo "VALIDATION_BEFORE_SUCCESS=true" >> "$GITHUB_ENV"
          fi

      # Process epidemic data detects raw changes against this commit (issue #725)
      - name: Record pre-fetch commit
        run: echo "PRE_FETCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch epidemic data
        id: fetch
        shell: bash
        run: |
          # パイプラインの終了コードを正しく伝播 (pipefailオプション)
          set -o pipefail

          # ログファイル名の決定 (workflow_typeベース)
          case "$WORKFLOW_TYPE" in
            manual) LOG_PREFIX="fetch" ;;
            weekly) LOG_PREFIX="weekly" ;;
            daily)  LOG_PREFIX="daily" ;;
          esac

          echo "Starting ${WORKFLOW_DISPLAY_NAME} at $FETCH_TIMESTAMP"

          # コマンドの構築
          FETCH_CMD=(uv run --locked fetch-data)

          # 年範囲の指定
          FETCH_CMD+=(--start-year "$START_YEAR")
          FETCH_CMD+=(--end-year "$END_YEAR")

          # モードを指定
          FETCH_CMD+=(--mode "$MODE")

          # データ種別・対象週・対象月の指定 (Prepare fetch parameters で検証済み。指定された場合のみ)
          if [ -n "${DATA_TYPES:-}" ]; then
            FETCH_CMD+=(--data-types "$DATA_TYPES")
          fi
          if [ -n "${TARGET_WEEKS:-}" ]; then
            FETCH_CMD+=(--target-weeks "$TARGET_WEEKS")
          fi
          if [ -n "${TARGET_MONTHS:-}" ]; then
            FETCH_CMD+=(--target-months "$TARGET_MONTHS")
          fi

          # DRY_RUNがtrueの場合
          if [ "$DRY_RUN" = "true" ]; then
            FETCH_CMD+=(--dry-run)
          fi

          FETCH_CMD+=(--log-file "data/logs/${LOG_PREFIX}_${FETCH_TIMESTAMP}.log")

          echo "Executing: ${FETCH_CMD[*]}"

          # メインスクリプトの実行
          # NOTE:
          # - pipefail: パイプライン全体の失敗を検出
          # - PIPESTATUS: 各コマンドの終了コード配列
          # PIPESTATUSは次のコマンド実行で上書きされるため、実行直後に退避する
          set +e
          "${FETCH_CMD[@]}" 2>&1 | tee "data/logs/console_${LOG_PREFIX}_${FETCH_TIMESTAMP}.log"
          PIPE_EXIT_CODES=("${PIPESTATUS[@]}")
          set -e

          FETCH_EXIT_CODE="${PIPE_EXIT_CODES[0]}"
          if [ "${FETCH_EXIT_CODE}" -eq 0 ]; then
            FETCH_STATUS="success"
            echo "✅ データ取得: 成功"
          else
            FETCH_STATUS="failed"
            echo "❌ データ取得: 失敗 (exit code: ${FETCH_EXIT_CODE})"
          fi

          # 実行結果を保存
          {
            echo "FETCH_RESULT=${FETCH_EXIT_CODE}"
            echo "FETCH_STATUS=${FETCH_STATUS}"
            echo "FETCH_CONTINUED_REASON=none"
          } >> "$GITHUB_ENV"

      - name: Fetch result gate
        id: fetch-gate
        if: env.FETCH_STATUS == 'failed'
        shell: bash
        env:
          CONTINUE_ON_FAILURE: ${{ inputs.continue_on_failure }}
          FORCE_MERGE_ON_FAILURE: ${{ inputs.force_merge_on_failure }}
        run: |
          echo "⚠️ データ取得に失敗しました (exit code: ${FETCH_RESULT})"
          echo "::error title=Data fetch failed::fetch-data exited with code ${FETCH_RESULT}; automatic merge will be blocked unless explicitly overridden"

          # 失敗時の動作制御
          # 真理値表:
          # continue_on_failure | force_merge_on_failure | 動作
          # -------------------|----------------------|------
          # true               | (any)                | 継続
          # false              | true                 | 継続（警告）
          # false              | false                | 終了（exit 1）
          if [ "$CONTINUE_ON_FAILURE" = "true" ]; then
            REASON="continue_on_failure=true により継続"
            echo "⚠️ 警告: ${REASON}"
            echo "FETCH_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
          else
            if [ "$FORCE_MERGE_ON_FAILURE" = "true" ]; then
              REASON="force_merge_on_failure=true により継続"
              echo "⚠️ 警告: ${REASON}"
              echo "FETCH_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
            else
              echo "🚫 fetch失敗のためジョブを終了します。"
              echo "::error::Fetch failed with exit code ${FETCH_RESULT}"
              exit 1
            fi
          fi

      - name: Process epidemic data
        id: process
        if: inputs.dry_run != true
        shell: bash
        env:
          CONTINUE_ON_FAILURE: ${{ inputs.continue_on_failure }}
          FORCE_MERGE_ON_FAILURE: ${{ inputs.force_merge_on_failure }}
        run: |
          # パイプラインの終了コードを正しく伝播 (pipefailオプション)
          set -o pipefail

          echo "Starting data processing at $(date +'%Y-%m-%d %H:%M:%S')"

          # 処理失敗時の動作制御
          # 真理値表:
          # continue_on_failure | force_merge_on_failure | 動作
          # -------------------|----------------------|------
          # true               | (any)                | 継続
          # false              | true                 | 継続（警告）
          # false              | false                | 終了（exit 1）
          handle_process_failure() {
            echo "❌ データ処理: 失敗"
            # 継続する場合も run に注記を残す (通知 issue は Notify pipeline anomaly が作る)
            echo "::error title=Data processing failed::process-data failed; automatic merge will be blocked unless explicitly overridden"
            {
              echo "PROCESS_RESULT=failed"
              echo "PROCESS_CONTINUED_REASON=none"
            } >> "$GITHUB_ENV"

            if [ "$CONTINUE_ON_FAILURE" = "true" ]; then
              REASON="continue_on_failure=true により継続"
              echo "⚠️ 警告: データ処理に失敗しましたが、${REASON}します。"
              echo "PROCESS_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
            else
              # force_merge_on_failureがfalseの場合は終了
              if [ "$FORCE_MERGE_ON_FAILURE" != "true" ]; then
                exit 1
              else
                REASON="force_merge_on_failure=true により継続"
                echo "⚠️ 警告: データ処理に失敗しましたが、${REASON}します。"
                echo "PROCESS_CONTINUED_REASON=${REASON}" >> "$GITHUB_ENV"
              fi
            fi
          }

          # このジョブで追加・変更された data/raw/*.csv (未追跡の新規ファイルを含む) を
          # fetch 前のコミット (PRE_FETCH_SHA) との比較で取得する (issue #725)
          # 検出自体に失敗したら件数を unknown とし、処理失敗として扱う (fail-closed)
          CHANGED_RAW_LIST="$RUNNER_TEMP/changed_raw_files_${FETCH_TIMESTAMP}.txt"
          CHANGED_RAW_FILES=()
          if bash scripts/list_changed_raw_files.sh "${PRE_FETCH_SHA:-}" > "$CHANGED_RAW_LIST"; then
            # while-read instead of mapfile so tests can run this step with macOS bash 3.2
            while IFS= read -r changed_raw_file || [ -n "$changed_raw_file" ]; do
              CHANGED_RAW_FILES+=("$changed_raw_file")
            done < "$CHANGED_RAW_LIST"
            RAW_CHANGED_COUNT=${#CHANGED_RAW_FILES[@]}
          else
            RAW_CHANGED_COUNT="unknown"
            echo "::error title=Raw change detection failed::scripts/list_changed_raw_files.sh failed (PRE_FETCH_SHA=${PRE_FETCH_SHA:-unset})"
          fi
          echo "RAW_CHANGED_COUNT=${RAW_CHANGED_COUNT}" >> "$GITHUB_ENV"

          if [ "$RAW_CHANGED_COUNT" = "unknown" ]; then
            handle_process_failure
          elif [ ${#CHANGED_RAW_FILES[@]} -eq 0 ]; then
            echo "ℹ️ 処理対象のrawファイルがありません。処理をスキップします。"
            {
              echo "PROCESS_RESULT=skipped"
              echo "PROCESS_CONTINUED_REASON=none"
            } >> "$GITHUB_ENV"
          else
            # 変更ファイル数を表示
            FILE_COUNT=${#CHANGED_RAW_FILES[@]}
            echo "📊 処理対象: ${FILE_COUNT}ファイル"
            for file in "${CHANGED_RAW_FILES[@]}"; do
              echo "  - $file"
            done

            # データ処理の実行 (変更されたファイルのみ)
            # 配列を安全に展開してスペースを含むファイル名にも対応
            # 注: set -o pipefailにより、パイプ内のPythonスクリプトの終了コードが正しく伝播される
            if uv run --locked process-data --files "${CHANGED_RAW_FILES[@]}" 2>&1 | tee "data/logs/process_${FETCH_TIMESTAMP}.log"; then
              echo "✅ データ処理: 成功"
              {
                echo "PROCESS_RESULT=success"
                echo "PROCESS_CONTINUED_REASON=none"
              } >> "$GITHUB_ENV"

              # stats.jsonから処理結果を抽出
              if [ -f "data/processed/stats.json" ]; then
                # JSON形式を事前検証 (jq -eで検証し、不正な場合は警告)
                if ! jq -e . data/processed/stats.json >/dev/null 2>&1; then
                  echo "⚠️ 警告: stats.jsonが不正なJSON形式です。デフォルト値を使用します。"
                  STATS_TOTAL="0"
                  STATS_SUCCEEDED="0"
                  STATS_FAILED="0"
                else
                  STATS_TOTAL=$(jq -r '.total' data/processed/stats.json 2>/dev/null || echo "0")
                  STATS_SUCCEEDED=$(jq -r '.succeeded' data/processed/stats.json 2>/dev/null || echo "0")
                  STATS_FAILED=$(jq -r '.failed' data/processed/stats.json 2>/dev/null || echo "0")
                fi

                # 環境変数を一括設定 (shellcheck SC2129対応)
                {
                  echo "STATS_TOTAL=${STATS_TOTAL}"
                  echo "STATS_SUCCEEDED=${STATS_SUCCEEDED}"
                  echo "STATS_FAILED=${STATS_FAILED}"
                } >> "$GITHUB_ENV"

                echo "📊 処理統計: 成功=${STATS_SUCCEEDED}/${STATS_TOTAL}, 失敗=${STATS_FAILED}"

                # エラー詳細を表示 (最大5件)
                ERROR_COUNT=$(jq -r '.errors | length' data/processed/stats.json 2>/dev/null || echo "0")
                if [ "${ERROR_COUNT}" -gt 0 ]; then
                  echo "⚠️ エラー詳細:"
                  jq -r '.errors[:5] | .[] | "  - \(.file): \(.error)"' data/processed/stats.json 2>/dev/null || echo "  エラー詳細の取得に失敗しました"
                  if [ "${ERROR_COUNT}" -gt 5 ]; then
                    echo "  ... 他$((ERROR_COUNT - 5))件のエラー"
                  fi
                fi
              fi
            else
              handle_process_failure
            fi
          fi

      # raw に対して processed が欠落・改訂後未再処理なら自動マージを止める (issue #725)
      # ステップ自体は失敗させない。判定は Evaluate auto-merge gate の blocker "coverage" が行う
      - name: Check processing coverage
        if: inputs.dry_run != true
        shell: bash
        run: |
          # レポートは data/ に置かない (PR に混入するため)
          COVERAGE_REPORT="$RUNNER_TEMP/processing_coverage_${FETCH_TIMESTAMP}.json"
          if uv run --locked check-data-status --json --fail-on-incomplete > "$COVERAGE_REPORT"; then
            STATUS=complete
            echo "✅ 処理カバレッジ: 完了"
          else
            STATUS=incomplete
            echo "::error title=Processing coverage incomplete::未処理・改訂後未再処理・処理できないrawがあります (一覧: check-data-status --verbose、再処理対象: check-data-status --list-needs-processing)"
            # 処理できないraw (reason 付き) は --list-needs-processing に出ないので、ここで列挙する
            jq -r '.coverage.incomplete_sources[] | select(.reason != null) | "  - \(.raw_file) (\(.reason))"' "$COVERAGE_REPORT" || echo "⚠️ レポート解析に失敗しました"
          fi
          echo "PROCESSING_COVERAGE_STATUS=${STATUS}" >> "$GITHUB_ENV"
          jq '.coverage | {raw_source_count, processed_source_count, incomplete_source_count, stale_source_count}' "$COVERAGE_REPORT" || echo "⚠️ レポート解析に失敗しました"

      - name: Validate fetched data
        id: validate-after
        if: inputs.validate_after && inputs.dry_run != true
        run: |
          echo "取得したデータの検証..."
          VALIDATION_REPORT="data/logs/validation_${FETCH_TIMESTAMP}.json"

          if uv run --locked validate-data data/raw --pattern "*.csv" --output "$VALIDATION_REPORT"; then
            echo "✅ データ検証成功"
            echo "VALIDATION_SUCCESS=true" >> "$GITHUB_ENV"
          else
            echo "❌ データ検証失敗"
            echo "VALIDATION_SUCCESS=false" >> "$GITHUB_ENV"

            # 検証レポートの内容を表示
            if [ -f "$VALIDATION_REPORT" ]; then
              echo "検証レポート:"
              jq .summary "$VALIDATION_REPORT" || echo "⚠️ レポート解析に失敗しました"
            fi

            # 検証失敗でもPR作成は続行 (レビューで確認)
          fi

      - name: Verify data continuity
        if: inputs.verify_continuity && inputs.dry_run != true
        run: |
          echo "データ連続性を検証しています..."
          CONTINUITY_REPORT="$RUNNER_TEMP/continuity_${FETCH_TIMESTAMP}.json"
          CONTINUITY_VALID=false
          # Check at least the previous year even when the fetch range is narrower: with the grace
          # period, last December stays pending until February, when scheduled fetches cover only
          # the current year (issue #731).
          # `[ -lt ]` rather than $(( )): the manual start_year input is a free string.
          CONTINUITY_START_YEAR="$PREVIOUS_YEAR"
          if [ "$START_YEAR" -lt "$PREVIOUS_YEAR" ]; then
            CONTINUITY_START_YEAR="$START_YEAR"
          fi
          echo "検証範囲: ${CONTINUITY_START_YEAR} - ${END_YEAR}"

          if uv run --locked check-missing data/raw \
            --start-year "$CONTINUITY_START_YEAR" \
            --end-year "$END_YEAR" \
            --as-of "$CURRENT_DATE" \
            --grace-periods 1 \
            --format json \
            --output "$CONTINUITY_REPORT"; then
            CONTINUITY_VALID=true
            echo "✅ データ連続性検証成功"
          else
            echo "❌ データ連続性検証失敗"
            echo "::error title=Data continuity validation failed::Missing periods were detected; automatic merge will be blocked"
          fi

          echo "CONTINUITY_VALID=$CONTINUITY_VALID" >> "$GITHUB_ENV"
          if [ -f "$CONTINUITY_REPORT" ]; then
            jq .summary "$CONTINUITY_REPORT" || echo "⚠️ レポート解析に失敗しました"
          fi

      # Charts and README stats are presentation only: a failure must not drop the data PR (issue #731)
      - name: Generate visualization charts
        id: charts
        if: inputs.dry_run != true
        continue-on-error: true
        run: |
          echo "📈 感染動向グラフを生成しています..."
          uv run --locked python scripts/generate_charts.py

          # グラフファイルをステージング
          if ! git diff --quiet docs/images/; then
            git add docs/images/
            echo "✅ Charts updated"
          fi

      - name: Update README statistics
        id: readme_stats
        if: inputs.dry_run != true
        continue-on-error: true
        run: |
          echo "📊 README統計情報を更新しています..."
          uv run --locked python scripts/update_readme_stats.py

          # 変更があればステージング
          if ! git diff --quiet README.md; then
            git add README.md
            echo "✅ README.md updated with latest statistics"
          else
            echo "ℹ️ No README changes needed"
          fi

      - name: Warn on chart or README statistics failure
        if: steps.charts.outcome == 'failure' || steps.readme_stats.outcome == 'failure'
        env:
          CHARTS_OUTCOME: ${{ steps.charts.outcome }}
          README_STATS_OUTCOME: ${{ steps.readme_stats.outcome }}
        run: |
          MESSAGE="グラフ生成=${CHARTS_OUTCOME} / README統計更新=${README_STATS_OUTCOME}。データPRは継続し、失敗したステップの出力は含めない"
          echo "::warning title=Chart or README statistics step failed::${MESSAGE}"
          echo "- ⚠️ **表示用ステップ失敗**: ${MESSAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: changes
        if: inputs.dry_run != true
        run: |
          git add data/

          # data/raw (CSV と .metadata) だけで判定する。README の実行時刻行や data/logs の差分は変更とみなさない。
          # 基準は fetch 前のコミット: fetch-data がローカルコミットした raw も staged diff だけでは見えないため
          if git diff --cached --quiet "$PRE_FETCH_SHA" -- data/raw; then
            echo "No data/raw changes detected"
            echo "HAS_DATA_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "data/raw changes detected"
            echo "HAS_DATA_CHANGES=true" >> "$GITHUB_ENV"

            # 新規ファイルと変更ファイルを分けて集計 (他のワークフローと統一)
            # POSIX準拠の空白クラス [[:space:]] と拡張正規表現 -E を使用

            # 新規rawファイル数 (data/raw/*.csv)
            NEW_RAW_FILES=$(git diff --cached --name-status "$PRE_FETCH_SHA" | grep -cE '^A[[:space:]]+data/raw/[^/]*\.csv$' | tr -d ' ' || echo "0")

            # 変更されたrawファイル数
            MODIFIED_RAW_FILES=$(git diff --cached --name-status "$PRE_FETCH_SHA" | grep -cE '^M[[:space:]]+data/raw/[^/]*\.csv$' | tr -d ' ' || echo "0")

            # 処理済みファイル数 (data/processed/normalized_*.csv、改訂後の再処理による更新を含む)
            NEW_PROCESSED_FILES=$(git diff --cached --name-status "$PRE_FETCH_SHA" | grep -cE '^[AM][[:space:]]+data/processed/normalized_.*\.csv$' | tr -d ' ' || echo "0")

            # 合計CSVファイル数
            TOTAL_CSV_FILES=$(git diff --cached --name-only "$PRE_FETCH_SHA" | grep -c '\.csv$' | tr -d ' ' || echo "0")

            # 空文字列や非数値の場合のフォールバック
            if ! [[ "$NEW_RAW_FILES" =~ ^[0-9]+$ ]]; then
              NEW_RAW_FILES="0"
            fi
            if ! [[ "$MODIFIED_RAW_FILES" =~ ^[0-9]+$ ]]; then
              MODIFIED_RAW_FILES="0"
            fi
            if ! [[ "$NEW_PROCESSED_FILES" =~ ^[0-9]+$ ]]; then
              NEW_PROCESSED_FILES="0"
            fi
            if ! [[ "$TOTAL_CSV_FILES" =~ ^[0-9]+$ ]]; then
              TOTAL_CSV_FILES="0"
            fi

            # 環境変数を設定
            # サマリーとPR作成スクリプトの両方で使用できるよう、2つの命名規則で設定
            NEW_CSV_FILES=$NEW_RAW_FILES
            MODIFIED_CSV_FILES=$MODIFIED_RAW_FILES

            {
              echo "NEW_CSV_FILES=$NEW_CSV_FILES"
              echo "MODIFIED_CSV_FILES=$MODIFIED_CSV_FILES"
              echo "NEW_PROCESSED_FILES=$NEW_PROCESSED_FILES"
              echo "CSV_FILES=$TOTAL_CSV_FILES"

              # サマリー用の変数名も設定 (後方互換性)
              echo "NEW_FILES=$NEW_CSV_FILES"
              echo "MODIFIED_FILES=$MODIFIED_CSV_FILES"
              echo "CHANGED_FILES=$TOTAL_CSV_FILES"
            } >> "$GITHUB_ENV"

            echo "📊 変更統計:"
            echo "  - 新規rawファイル: $NEW_RAW_FILES"
            echo "  - 更新rawファイル: $MODIFIED_RAW_FILES"
            echo "  - 処理済みファイル: $NEW_PROCESSED_FILES"
            echo "  - 合計CSVファイル: $TOTAL_CSV_FILES"
          fi

      # Bot data PRs merge before test.yml can run, so the schema check runs here (issue #731)
      # ステップ自体は失敗させない。判定は Evaluate auto-merge gate の blocker "schema" が行う
      - name: Validate metadata against JSON Schema
        if: inputs.dry_run != true
        shell: bash
        run: |
          if uv run --locked python scripts/validate_metadata_schema.py; then
            SCHEMA_VALID=true
          else
            SCHEMA_VALID=false
            echo "::error title=Metadata schema validation failed::メタデータが JSON Schema に適合しません。自動マージはブロックされます"
          fi
          echo "SCHEMA_VALID=${SCHEMA_VALID}" >> "$GITHUB_ENV"

      - name: Evaluate auto-merge gate
        if: inputs.dry_run != true
        shell: bash
        env:
          AUTO_MERGE: ${{ inputs.auto_merge }}
          FORCE_MERGE_ON_FAILURE: ${{ inputs.force_merge_on_failure }}
          FETCH_STATUS: ${{ env.FETCH_STATUS }}
          PROCESS_RESULT: ${{ env.PROCESS_RESULT }}
          RAW_CHANGED_COUNT: ${{ env.RAW_CHANGED_COUNT }}
          PROCESSING_COVERAGE_STATUS: ${{ env.PROCESSING_COVERAGE_STATUS }}
          VERIFY_CONTINUITY: ${{ inputs.verify_continuity }}
          CONTINUITY_VALID: ${{ env.CONTINUITY_VALID }}
          VALIDATION_BEFORE_SUCCESS: ${{ env.VALIDATION_BEFORE_SUCCESS }}
          VALIDATION_SUCCESS: ${{ env.VALIDATION_SUCCESS }}
          SCHEMA_VALID: ${{ env.SCHEMA_VALID }}
        run: |
          case "$WORKFLOW_TYPE" in
            manual) WORKFLOW_NAME="fetch-data" ;;
            weekly) WORKFLOW_NAME="fetch-data-weekly" ;;
            daily)  WORKFLOW_NAME="fetch-data-daily" ;;
            *)      WORKFLOW_NAME="unknown" ;;
          esac

          source scripts/auto_merge_gate.sh
          evaluate_auto_merge_gate
          write_auto_merge_gate_env

      - name: Create Pull Request
        if: env.HAS_DATA_CHANGES == 'true' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 共通スクリプトで使用する環境変数
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 詳細統計 (他のワークフローと統一)
          NEW_FILES: ${{ env.NEW_CSV_FILES }}
          MODIFIED_FILES: ${{ env.MODIFIED_CSV_FILES }}
          CHANGED_FILES: ${{ env.CSV_FILES }}
          NEW_PROCESSED_FILES: ${{ env.NEW_PROCESSED_FILES }}
          # auto_merge設定
          AUTO_MERGE: ${{ inputs.auto_merge }}
          FORCE_MERGE_ON_FAILURE: ${{ inputs.force_merge_on_failure }}
          FETCH_STATUS: ${{ env.FETCH_STATUS }}
          PROCESS_RESULT: ${{ env.PROCESS_RESULT }}
          FETCH_CONTINUED_REASON: ${{ env.FETCH_CONTINUED_REASON }}
          PROCESS_CONTINUED_REASON: ${{ env.PROCESS_CONTINUED_REASON }}
          VERIFY_CONTINUITY: ${{ inputs.verify_continuity }}
          CONTINUITY_VALID: ${{ env.CONTINUITY_VALID }}
          VALIDATION_BEFORE_SUCCESS: ${{ env.VALIDATION_BEFORE_SUCCESS }}
          VALIDATION_SUCCESS: ${{ env.VALIDATION_SUCCESS }}
          SCHEMA_VALID: ${{ env.SCHEMA_VALID }}
          AUTO_MERGE_GATE_EVALUATED: ${{ env.AUTO_MERGE_GATE_EVALUATED }}
          AUTO_MERGE_REQUESTED: ${{ env.AUTO_MERGE_REQUESTED }}
          FORCE_MERGE: ${{ env.FORCE_MERGE }}
          FETCH_GATE_STATUS: ${{ env.FETCH_GATE_STATUS }}
          PROCESS_GATE_STATUS: ${{ env.PROCESS_GATE_STATUS }}
          VALIDATION_GATE_STATUS: ${{ env.VALIDATION_GATE_STATUS }}
          CONTINUITY_GATE_STATUS: ${{ env.CONTINUITY_GATE_STATUS }}
          AUTO_MERGE_GATE_STATUS: ${{ env.AUTO_MERGE_GATE_STATUS }}
          AUTO_MERGE_BLOCKERS: ${{ env.AUTO_MERGE_BLOCKERS }}
          AUTO_MERGE_OVERRIDE_USED: ${{ env.AUTO_MERGE_OVERRIDE_USED }}
          AUTO_MERGE_EFFECTIVE: ${{ env.AUTO_MERGE_EFFECTIVE }}
        run: |
          # workflow_type を create_pr.sh が認識する workflow_name 識別子へ変換する。
          # create_pr.sh はこの識別子でブランチ名・コミットメッセージ・自動マージ検証ゲートを分岐するため、
          # 旧来の "data-update-*" を渡すと全て default 分岐に落ち、ブランチ名二重化・検証ゲート無効化を招く。
          case "$WORKFLOW_TYPE" in
            manual) WORKFLOW_NAME="fetch-data" ;;
            weekly) WORKFLOW_NAME="fetch-data-weekly" ;;
            daily)  WORKFLOW_NAME="fetch-data-daily" ;;
            *)      WORKFLOW_NAME="fetch-data" ;;
          esac

          # 共通スクリプトを呼び出し
          bash scripts/create_pr.sh "$WORKFLOW_NAME" "$WORKFLOW_DISPLAY_NAME"

      # No PR is created without data/raw changes, so a blocked gate would otherwise go unnoticed (issue #731)
      - name: Fail when gate is blocked without PR
        if: inputs.dry_run != true && env.HAS_DATA_CHANGES != 'true' && env.AUTO_MERGE_BLOCKERS != 'none'
        shell: bash
        run: |
          echo "::error title=Auto-merge gate blocked without PR::data/raw に変更が無いため PR は作成しないが、ゲートがブロックしている (ブロック理由: ${AUTO_MERGE_BLOCKERS:-unset})"
          exit 1

      # One deduplicated issue per anomaly kind; placed after the PR so it never blocks the PR (issue #733)
      - name: Notify pipeline anomaly
        if: always() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PIPELINE_NAME: ${{ inputs.workflow_type }}
        run: bash scripts/notify_pipeline_issue.sh

      # Only this run's files: data/logs also holds every committed log (issue #733)
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.workflow_type }}-logs-${{ env.FETCH_TIMESTAMP }}
          path: data/logs/*_${{ env.FETCH_TIMESTAMP }}.*
          if-no-files-found: warn
          retention-days: ${{ inputs.log_retention_days }}

      - name: Generate summary
        if: always()
        env:
          FORCE_MERGE_ON_FAILURE: ${{ inputs.force_merge_on_failure }}
        run: |
          {
            echo "## 📊 ${WORKFLOW_DISPLAY_NAME}サマリー"
            echo ""
            echo "- **実行日時**: ${CURRENT_DATE:-} ${FETCH_TIMESTAMP:-}"
            echo "- **対象期間**: ${START_YEAR:-} - ${END_YEAR:-}"
            echo "- **対象週**: ${TARGET_WEEKS:-指定なし}"
            echo "- **対象月**: ${TARGET_MONTHS:-指定なし}"
            echo "- **データタイプ**: ${DATA_TYPES:-全タイプ}"
            echo "- **現在の週**: 第${CURRENT_WEEK:-}週"
            echo "- **収集モード**: ${MODE:-}"
            echo "- **ドライラン**: ${DRY_RUN:-false}"
            echo ""
            echo "### 🔄 データ取得結果"
            echo "- **取得ステータス**: ${FETCH_STATUS:-unknown}"
            echo "- **終了コード**: ${FETCH_RESULT:-N/A}"
            if [ -n "${FETCH_CONTINUED_REASON:-}" ] && [ "${FETCH_CONTINUED_REASON}" != "none" ]; then
              echo "- **継続理由**: ${FETCH_CONTINUED_REASON}"
            fi
            echo ""
            echo "### 🛡️ 自動マージゲート"
            echo "- **取得**: ${FETCH_GATE_STATUS:-not_evaluated}"
            echo "- **処理**: ${PROCESS_GATE_STATUS:-not_evaluated}"
            echo "- **検証**: ${VALIDATION_GATE_STATUS:-not_evaluated}"
            echo "- **連続性**: ${CONTINUITY_GATE_STATUS:-not_evaluated}"
            echo "- **schema**: ${SCHEMA_GATE_STATUS:-not_evaluated}"
            echo "- **処理カバレッジ**: ${PROCESSING_COVERAGE_STATUS:-not_evaluated}"
            echo "- **raw 変更件数**: ${RAW_CHANGED_COUNT:-not_evaluated}"
            echo "- **ブロック理由**: ${AUTO_MERGE_BLOCKERS:-not_evaluated}"
            echo "- **判定**: ${AUTO_MERGE_GATE_STATUS:-not_evaluated}"
            if [ "${AUTO_MERGE_SETUP_FAILED:-}" = "true" ]; then
              echo "- **auto-merge 設定**: ⚠️ 失敗 (手動マージが必要)"
            fi
            echo "- **強制上書き要求**: ${FORCE_MERGE_ON_FAILURE}"
            echo "- **強制上書き適用**: ${AUTO_MERGE_OVERRIDE_USED:-false}"
            echo "- **取得失敗後の継続理由**: ${FETCH_CONTINUED_REASON:-none}"
            echo "- **処理失敗後の継続理由**: ${PROCESS_CONTINUED_REASON:-none}"
            echo ""

            if [ "${HAS_DATA_CHANGES:-}" = "true" ]; then
              echo "### ✅ 変更検出"
              echo "- **総変更ファイル数**: $CHANGED_FILES"
              if [ -n "$NEW_FILES" ] && [ "$NEW_FILES" -gt 0 ]; then
                echo "- **新規ファイル**: $NEW_FILES"
              fi
              if [ -n "$MODIFIED_FILES" ] && [ "$MODIFIED_FILES" -gt 0 ]; then
                echo "- **更新ファイル**: $MODIFIED_FILES"
              fi
              if [ -n "$PR_URL" ]; then
                echo "- **Pull Request**: $PR_URL"
              fi
            else
              echo "### ℹ️ 変更なし"
              echo "data/raw に変更が無いため PR は作成しない。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
