name: 🧪 テストスイート実行

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 09:17 JST; avoid top-of-hour Actions load.
    - cron: "17 0 * * 2"
  workflow_dispatch:

# 最小権限原則 (issue #299): テスト/lintはコミット・PR操作を行わないため read-only で十分。
# - actions/checkout: contents: read
# - codecov-action: CODECOV_TOKEN (リポジトリシークレット) を使用するため GITHUB_TOKEN 追加権限不要
# - actions/upload-artifact: GITHUB_TOKEN を使用しない (Actions API 側で別管理)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python 3.11
        run: uv python install 3.11

      - name: Verify and audit locked dependencies
        timeout-minutes: 5
        run: uv --preview-features audit-command audit --locked

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Create test directories
        run: |
          mkdir -p data/raw data/processed data/logs data/quarantine
          mkdir -p tests/temp

      - name: Run unit tests
        run: |
          uv run --locked pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage_html \
            --cov-report=xml \
            --cov-branch \
            --cov-fail-under=100 \
            --verbose \
            -p no:warnings

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: pytest-unittests
          name: Python 3.11 Unit Tests
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 7

      - name: Test dry run of main script
        run: |
          uv run --locked fetch-data \
            --dry-run \
            --start-year 2025 \
            --end-year 2025 \
            --data-types "sentinel_weekly_gender" \
            --log-file tests/temp/test.log

      - name: Check deprecated CLI usage
        run: |
          uv run --locked python scripts/check_deprecated_cli_usage.py

      - name: Check script syntax
        run: |
          uv run --locked python -m py_compile src/cli/fetch_data.py
          uv run --locked python -m py_compile scripts/check_missing.py
          uv run --locked python -m py_compile src/fetchers/base_fetcher.py
          uv run --locked python -m py_compile src/fetchers/enhanced_fetcher.py
          uv run --locked python -m py_compile src/managers/config_manager.py
          uv run --locked python -m py_compile src/managers/storage_manager.py

      - name: Validate metadata against JSON Schema (v1.3.0)
        run: |
          uv run --locked python scripts/validate_metadata_schema.py

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Summary"
            echo ""
            echo "- Python Version: 3.11"
            echo "- Test Status: ${{ job.status }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f tests/temp/test.log ]; then
            {
              echo "### Dry Run Log (last 20 lines)"
              echo '```'
              tail -n 20 tests/temp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install linting tools
        run: uv sync --all-extras --locked

      - name: Run all pre-commit hooks
        run: |
          uv run --locked pre-commit run --all-files --show-diff-on-failure

      - name: Run Ruff linter
        run: |
          uv run --locked ruff check src/ scripts/ tests/

      - name: Check black formatting
        run: |
          uv run --locked black --check --diff src/ scripts/ tests/ --line-length=120

      - name: Check import sorting
        run: |
          uv run --locked isort --check-only --diff src/ scripts/ tests/

      - name: Run mypy type checking
        run: |
          uv run --locked mypy src/ scripts/ --ignore-missing-imports --no-strict-optional
