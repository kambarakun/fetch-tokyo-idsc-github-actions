name: 🧪 テストスイート実行

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 09:17 JST; avoid top-of-hour Actions load.
    - cron: "17 0 * * 2"
  workflow_dispatch:

# 最小権限原則 (issue #299): テスト/lintはコミット・PR操作を行わないため read-only で十分。
# - actions/checkout: contents: read
# - codecov-action: CODECOV_TOKEN (リポジトリシークレット) を使用するため GITHUB_TOKEN 追加権限不要
# - actions/upload-artifact: GITHUB_TOKEN を使用しない (Actions API 側で別管理)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv の pin は .tool-versions に置く (issue #681): 未指定だと pyproject/uv.toml -> latest の順で解決される
          version-file: .tool-versions
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python 3.11
        run: uv python install 3.11

      - name: Verify and audit locked dependencies
        timeout-minutes: 5
        run: uv --preview-features audit-command audit --locked

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Create test directories
        run: |
          mkdir -p data/raw data/processed data/logs data/quarantine
          mkdir -p tests/temp

      - name: Run unit tests
        run: |
          uv run --locked pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage_html \
            --cov-report=xml \
            --cov-branch \
            --cov-fail-under=100 \
            --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: pytest-unittests
          name: Python 3.11 Unit Tests
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 7

      - name: Plan a fetch offline
        # --plan-only sends no request to the data source and writes nothing, so check the JSON content
        # (2025 has 52 ISO weeks, so W53 must not be planned) and that data/ is untouched
        run: |
          uv run --locked fetch-data \
            --plan-only \
            --mode full \
            --start-year 2025 \
            --end-year 2025 \
            --target-weeks 1,52,53 \
            --data-types "sentinel_weekly_gender" > "$RUNNER_TEMP/fetch-plan.json"
          uv run --locked python - "$RUNNER_TEMP/fetch-plan.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)
          files = [candidate["file"] for candidate in plan["candidates"]]
          expected = ["sentinel_weekly_gender_2025_01.csv", "sentinel_weekly_gender_2025_52.csv"]
          if plan["kind"] != "fetch-plan" or plan["mode"] != "full":
              sys.exit(f"unexpected plan header: kind={plan['kind']} mode={plan['mode']}")
          if files != expected or plan["candidate_count"] != len(expected):
              sys.exit(f"unexpected candidates: {files} (candidate_count={plan['candidate_count']})")
          if not plan["not_verified"]:
              sys.exit("not_verified is empty")
          print(f"fetch plan OK: {files}")
          PY
          test -z "$(git status --porcelain --untracked-files=all -- data)"

      - name: Check deprecated CLI usage
        run: |
          uv run --locked python scripts/check_deprecated_cli_usage.py

      - name: Check script syntax
        run: |
          uv run --locked python -m py_compile src/cli/fetch_data.py
          uv run --locked python -m py_compile src/fetchers/base_fetcher.py
          uv run --locked python -m py_compile src/fetchers/enhanced_fetcher.py
          uv run --locked python -m py_compile src/managers/config_manager.py
          uv run --locked python -m py_compile src/managers/storage_manager.py

      - name: Validate metadata against JSON Schema (v1.3.0)
        run: |
          uv run --locked python scripts/validate_metadata_schema.py

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Summary"
            echo ""
            echo "- Python Version: 3.11"
            echo "- Test Status: ${{ job.status }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$RUNNER_TEMP/fetch-plan.json" ]; then
            {
              echo "### Offline Fetch Plan (first 20 lines)"
              echo '```json'
              head -n 20 "$RUNNER_TEMP/fetch-plan.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv の pin は .tool-versions に置く (issue #681): 未指定だと pyproject/uv.toml -> latest の順で解決される
          version-file: .tool-versions
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install linting tools
        run: uv sync --all-extras --locked

      - name: Run all pre-commit hooks
        run: |
          uv run --locked pre-commit run --all-files --show-diff-on-failure
