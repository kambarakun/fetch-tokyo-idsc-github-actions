name: 🔧 Dependabot uv lock 自動更新

# DependabotのPRに対してuv lockを実行し、uvネイティブなlockfileを生成する
# これにより、他のワークフローのuv lock --checkが成功する
on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-uv-lock:
    # DependabotのPRのみを対象とする
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Update uv.lock with uv native command
        run: |
          if ! uv lock; then
            echo "::error::uv lock failed. Please check pyproject.toml for syntax errors or dependency conflicts."
            exit 1
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet uv.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated lockfile
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: uvネイティブなlockfileに更新

          Dependabotが更新したpyproject.tomlに基づいて、
          uvネイティブなlockfileを再生成しました。

          🤖 Generated by Dependabot uv lock workflow
          Co-Authored-By: dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>"
          git push

      - name: Notify about lockfile update
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔧 `uv lock`によってlockfileを更新しました。\n\nこれからCI/CDチェック (`uv lock --check`) が実行されます。結果をご確認ください。\n\n---\n💡 このコメントは`dependabot-uv-lock.yml`ワークフローにより自動投稿されました。'
            })
