name: 🔄 メタデータマイグレーション

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 ドライラン (変更を保存しない)"
        required: false
        default: false
        type: boolean
      target_version:
        description: "🎯 目標バージョン (空欄で最新)"
        required: false
        default: ""
        type: string

  # METADATA_VERSION が変更されたとき自動実行
  push:
    branches:
      - main
    paths:
      - "src/managers/storage_manager.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: migrate-metadata
  cancel-in-progress: false

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Check METADATA_VERSION change
        id: check
        run: |
          # 手動実行の場合は常にtrue
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_version=${{ github.event.inputs.target_version }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 前のコミットのファイルを一時的に取得
          git show HEAD^:src/managers/storage_manager.py > /tmp/old_storage_manager.py 2>/dev/null || echo "" > /tmp/old_storage_manager.py

          OLD_VERSION=$(uv run python -c "
          import re
          try:
              content = open('/tmp/old_storage_manager.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              print(match.group(1) if match else '')
          except Exception:
              print('')
          ")
          NEW_VERSION=$(uv run python -c "
          import re
          try:
              content = open('src/managers/storage_manager.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              print(match.group(1) if match else '')
          except Exception:
              print('')
          ")

          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "METADATA_VERSION changed from $OLD_VERSION to $NEW_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "METADATA_VERSION unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  migrate:
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Prepare parameters
        id: params
        run: |
          # イベント種別に応じてパラメータを設定
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            TARGET_VERSION="${{ github.event.inputs.target_version }}"
          else
            # push イベントの場合はデフォルト値を使用
            DRY_RUN="false"
            TARGET_VERSION=""
          fi

          # 空の場合はfalseに
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          # 目標バージョンが指定されていない場合は検出されたバージョンを使用
          if [ -z "$TARGET_VERSION" ]; then
            if [ -n "${{ needs.check-version-change.outputs.new_version }}" ]; then
              TARGET_VERSION="${{ needs.check-version-change.outputs.new_version }}"
            else
              # Pythonで堅牢にバージョンを抽出
              TARGET_VERSION=$(uv run python -c "
          import re
          content = open('src/managers/storage_manager.py').read()
          match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
          print(match.group(1) if match else '1.0')
          ")
            fi
          fi

          echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV
          echo "TARGET_VERSION=$TARGET_VERSION" >> $GITHUB_ENV
          echo "target=$TARGET_VERSION" >> $GITHUB_OUTPUT

          echo "Parameters:"
          echo "  Dry run: $DRY_RUN"
          echo "  Target version: $TARGET_VERSION"

      - name: Run migration (dry-run check)
        id: dry_run
        run: |
          echo "=== Dry Run ==="
          uv run python scripts/migrate_metadata.py --dry-run --target-version "$TARGET_VERSION" 2>&1 | tee dry_run.log

          # マイグレーション対象があるか確認 (空の場合は0をデフォルト)
          MIGRATED=$(grep "Migrated:" dry_run.log | awk '{print $2}')
          MIGRATED=${MIGRATED:-0}
          echo "migrated_count=$MIGRATED" >> $GITHUB_OUTPUT

      - name: Run migration
        if: env.DRY_RUN != 'true' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          echo "=== Running Migration ==="
          uv run python scripts/migrate_metadata.py --target-version "$TARGET_VERSION" --verbose

      - name: Configure git
        if: env.DRY_RUN != 'true' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create commit
        if: env.DRY_RUN != 'true' && steps.dry_run.outputs.migrated_count != '0'
        env:
          MIGRATED_COUNT: ${{ steps.dry_run.outputs.migrated_count }}
        run: |
          git add data/raw/.metadata/*.json

          if ! git diff --staged --quiet; then
            printf -v COMMIT_MSG "chore(metadata): migrate to version %s\n\nMigrated %s metadata files to version %s.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
              "$TARGET_VERSION" "$MIGRATED_COUNT" "$TARGET_VERSION"
            git commit -m "$COMMIT_MSG"
            git push
            echo "Migration committed and pushed"
          else
            echo "No changes to commit"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🔄 メタデータマイグレーションサマリー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **目標バージョン**: $TARGET_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **マイグレーション対象**: ${{ steps.dry_run.outputs.migrated_count }}ファイル" >> $GITHUB_STEP_SUMMARY
          echo "- **ドライラン**: $DRY_RUN" >> $GITHUB_STEP_SUMMARY

          if [ "$DRY_RUN" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **ドライランモード**: 変更は保存されていません。" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.dry_run.outputs.migrated_count }}" = "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ すべてのメタデータファイルは既に目標バージョンです。" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ マイグレーションが正常に完了しました。" >> $GITHUB_STEP_SUMMARY
          fi
