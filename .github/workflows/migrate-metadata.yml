name: 🔄 メタデータマイグレーション

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 ドライラン (変更を保存しない)"
        required: false
        default: false
        type: boolean
      target_version:
        description: "🎯 目標バージョン (空欄で最新)"
        required: false
        default: ""
        type: string

  # METADATA_VERSION が変更されたとき自動実行
  push:
    branches:
      - main
    paths:
      - "src/managers/storage_manager.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: migrate-metadata
  cancel-in-progress: false

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          # check-version-change ジョブは依存関係不要 (re モジュールのみ使用)
          # workflow_dispatch 時は早期終了するためキャッシュを無効化
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.11

      - name: Check METADATA_VERSION change
        id: check
        run: |
          # 手動実行の場合は常にtrue
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_version=${{ github.event.inputs.target_version }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 前のコミットのファイルを一時的に取得
          git show HEAD^:src/managers/storage_manager.py > /tmp/old_storage_manager.py 2>/dev/null || echo "" > /tmp/old_storage_manager.py

          OLD_VERSION=$(uv run python -c "
          import re
          try:
              content = open('/tmp/old_storage_manager.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              print(match.group(1) if match else '')
          except Exception:
              print('')
          ")
          NEW_VERSION=$(uv run python -c "
          import re
          try:
              content = open('src/managers/storage_manager.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              print(match.group(1) if match else '')
          except Exception:
              print('')
          ")

          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "METADATA_VERSION changed from $OLD_VERSION to $NEW_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "METADATA_VERSION unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  migrate:
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.params.outputs.dry_run }}
      target_version: ${{ steps.params.outputs.target_version }}
      migrated_count: ${{ steps.dry_run.outputs.migrated_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Prepare parameters
        id: params
        run: |
          # イベント種別に応じてパラメータを設定
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            TARGET_VERSION="${{ github.event.inputs.target_version }}"
          else
            # push イベントの場合はデフォルト値を使用
            DRY_RUN="false"
            TARGET_VERSION=""
          fi

          # DRY_RUN: 空の場合はfalseに正規化
          if [ -z "$DRY_RUN" ] || [ "$DRY_RUN" = "false" ]; then
            DRY_RUN="false"
          else
            DRY_RUN="true"
          fi

          # 目標バージョンが指定されていない場合は検出されたバージョンを使用
          if [ -z "$TARGET_VERSION" ]; then
            if [ -n "${{ needs.check-version-change.outputs.new_version }}" ]; then
              TARGET_VERSION="${{ needs.check-version-change.outputs.new_version }}"
            else
              # Pythonで堅牢にバージョンを抽出
              TARGET_VERSION=$(uv run python -c "
          import re
          import sys
          try:
              content = open('src/managers/storage_manager.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              if match:
                  print(match.group(1))
              else:
                  print('ERROR: METADATA_VERSION not found', file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          ")

              # バージョン抽出に失敗した場合はワークフローを停止
              if [ $? -ne 0 ] || [ -z "$TARGET_VERSION" ]; then
                echo "::error::METADATA_VERSION の抽出に失敗しました。storage_manager.py を確認してください。"
                exit 1
              fi
            fi
          fi

          # outputs として出力 (後続ステップで参照)
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT

          echo "Parameters:"
          echo "  Dry run: $DRY_RUN"
          echo "  Target version: $TARGET_VERSION"

      - name: Run migration (dry-run check)
        id: dry_run
        run: |
          echo "=== Dry Run ==="
          uv run python scripts/migrate_metadata.py --dry-run --target-version "${{ steps.params.outputs.target_version }}" 2>&1 | tee dry_run.log

          # マイグレーション対象があるか確認 (空の場合は0をデフォルト)
          # ログ形式: "2025-12-17 07:45:46 - INFO - Migrated:       7546"
          # awk '{print $2}' だと時刻(07:45:46)を取得してしまうため、
          # sedで "Migrated:" の後の数値を抽出する
          MIGRATED=$(grep "Migrated:" dry_run.log | sed -E 's/.*Migrated:\s*([0-9]+).*/\1/')
          MIGRATED=${MIGRATED:-0}
          echo "migrated_count=$MIGRATED" >> $GITHUB_OUTPUT

      - name: Run migration
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          echo "=== Running Migration ==="
          uv run python scripts/migrate_metadata.py --target-version "${{ steps.params.outputs.target_version }}" --verbose

      - name: Run verification
        id: verify
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          echo "=== Running Verification ==="
          # 検証を実行 (--verbose と --output-json を同時使用)
          # ログはstderr、JSONはstdoutに出力される
          STATS=$(uv run python scripts/verify_metadata.py --only-unverified --verbose --output-json)

          # jq で堅牢にパース
          VERIFIED=$(echo "$STATS" | jq -r '.verified // 0')
          FAILED=$(echo "$STATS" | jq -r '.failed // 0')
          echo "verified_count=$VERIFIED" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED" >> $GITHUB_OUTPUT
          echo "Verification completed: verified=$VERIFIED, failed=$FAILED"

      - name: Configure git
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set environment variables
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "FETCH_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TARGET_VERSION: ${{ steps.params.outputs.target_version }}
          MIGRATED_COUNT: ${{ steps.dry_run.outputs.migrated_count }}
        run: |
          git add data/raw/.metadata/*.json

          if ! git diff --staged --quiet; then
            # 共通スクリプトを呼び出し
            bash scripts/create_pr.sh "migrate-metadata" "メタデータマイグレーション"
          else
            echo "No changes to commit"
          fi

      - name: Summary
        if: always()
        run: |
          # 変数のデフォルト値を設定 (前のステップが失敗した場合に備える)
          TARGET_VERSION="${{ steps.params.outputs.target_version }}"
          TARGET_VERSION="${TARGET_VERSION:-不明}"

          DRY_RUN="${{ steps.params.outputs.dry_run }}"
          DRY_RUN="${DRY_RUN:-false}"

          MIGRATED_COUNT="${{ steps.dry_run.outputs.migrated_count }}"
          MIGRATED_COUNT="${MIGRATED_COUNT:-0}"

          VERIFIED_COUNT="${{ steps.verify.outputs.verified_count }}"
          VERIFIED_COUNT="${VERIFIED_COUNT:-0}"
          FAILED_COUNT="${{ steps.verify.outputs.failed_count }}"
          FAILED_COUNT="${FAILED_COUNT:-0}"

          echo "## 🔄 メタデータマイグレーションサマリー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **目標バージョン**: $TARGET_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **マイグレーション対象**: ${MIGRATED_COUNT}ファイル" >> $GITHUB_STEP_SUMMARY
          echo "- **ドライラン**: $DRY_RUN" >> $GITHUB_STEP_SUMMARY

          if [ "$DRY_RUN" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **ドライランモード**: 変更は保存されていません。" >> $GITHUB_STEP_SUMMARY
          elif [ "$MIGRATED_COUNT" = "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ すべてのメタデータファイルは既に目標バージョンです。" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ マイグレーションが正常に完了しました。" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 検証結果" >> $GITHUB_STEP_SUMMARY
            echo "- **検証成功**: ${VERIFIED_COUNT}ファイル" >> $GITHUB_STEP_SUMMARY
            echo "- **検証失敗**: ${FAILED_COUNT}ファイル" >> $GITHUB_STEP_SUMMARY
          fi
