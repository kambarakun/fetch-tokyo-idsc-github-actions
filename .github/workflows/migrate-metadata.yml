name: 🔀 メタデータマイグレーション

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 ドライラン (変更を保存しない)"
        required: false
        default: false
        type: boolean
      target_version:
        description: "🎯 目標バージョン (空欄で最新)"
        required: false
        default: ""
        type: string

  # METADATA_VERSION が変更されたとき自動実行
  push:
    branches:
      - main
    paths:
      - "src/models/metadata.py"

# 書込権限は PR を作る migrate ジョブにだけ付ける
permissions:
  contents: read

# shell を明示すると bash --noprofile --norc -eo pipefail {0} で動く (未指定の既定は pipefail なしの bash -e)
defaults:
  run:
    shell: bash

concurrency:
  group: migrate-metadata
  cancel-in-progress: false

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv の pin は .tool-versions に置く (issue #681): 未指定だと pyproject/uv.toml -> latest の順で解決される
          version-file: .tool-versions
          # check-version-change ジョブは依存関係不要 (re モジュールのみ使用)
          # workflow_dispatch 時は早期終了するためキャッシュを無効化
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.11

      - name: Check METADATA_VERSION change
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 手動実行の場合は常にtrue (目標バージョンは migrate ジョブが入力から直接読んで検証する)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 前のコミットのファイルを一時的に取得
          git show HEAD^:src/models/metadata.py > /tmp/old_metadata.py 2>/dev/null || echo "" > /tmp/old_metadata.py

          OLD_VERSION=$(uv run --no-project python -c "
          import re
          try:
              content = open('/tmp/old_metadata.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              print(match.group(1) if match else '')
          except Exception:
              print('')
          ")
          NEW_VERSION=$(uv run --no-project python -c "
          import re
          try:
              content = open('src/models/metadata.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              print(match.group(1) if match else '')
          except Exception:
              print('')
          ")

          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "METADATA_VERSION changed from $OLD_VERSION to $NEW_VERSION"
            {
              echo "changed=true"
              echo "new_version=$NEW_VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            echo "METADATA_VERSION unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      dry_run: ${{ steps.params.outputs.dry_run }}
      target_version: ${{ steps.params.outputs.target_version }}
      migrated_count: ${{ steps.dry_run.outputs.migrated_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv の pin は .tool-versions に置く (issue #681): 未指定だと pyproject/uv.toml -> latest の順で解決される
          version-file: .tool-versions
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.11

      # schema 検証ステップの jsonschema が dev extra にあるため test.yml と同じく全 extra を入れる
      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Prepare parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_TARGET_VERSION: ${{ github.event.inputs.target_version }}
          DETECTED_VERSION: ${{ needs.check-version-change.outputs.new_version }}
        run: |
          # イベント種別に応じてパラメータを設定
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY_RUN="$INPUT_DRY_RUN"
            TARGET_VERSION="$INPUT_TARGET_VERSION"
          else
            # push イベントの場合はデフォルト値を使用
            DRY_RUN="false"
            TARGET_VERSION=""
          fi

          # DRY_RUN: 空の場合はfalseに正規化
          if [ -z "$DRY_RUN" ] || [ "$DRY_RUN" = "false" ]; then
            DRY_RUN="false"
          else
            DRY_RUN="true"
          fi

          # 目標バージョンが指定されていない場合は検出されたバージョンを使用
          if [ -z "$TARGET_VERSION" ]; then
            if [ -n "$DETECTED_VERSION" ]; then
              TARGET_VERSION="$DETECTED_VERSION"
            # Pythonで堅牢にバージョンを抽出 (失敗したらワークフローを停止)
            elif ! TARGET_VERSION=$(uv run --locked python -c "
          import re
          import sys
          try:
              content = open('src/models/metadata.py').read()
              match = re.search(r'^METADATA_VERSION\s*=\s*[\"\\']([^\"\\']*)[\"\\']', content, re.MULTILINE)
              if match:
                  print(match.group(1))
              else:
                  print('ERROR: METADATA_VERSION not found', file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          "); then
              echo "::error::METADATA_VERSION の抽出に失敗しました。metadata.py を確認してください。"
              exit 1
            fi
          fi

          # 入力値は GITHUB_OUTPUT とコマンドライン引数に渡すので、形式を確かめてから使う
          # (登録済みのバージョンかどうかは migrate-metadata が走査前に検査して exit 2 にする)
          VERSION_PATTERN='^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          if ! [[ "$TARGET_VERSION" =~ $VERSION_PATTERN ]]; then
            echo "::error::目標バージョンの形式が不正です (例: 1.3.0)。"
            exit 1
          fi

          # outputs として出力 (後続ステップで参照)
          {
            echo "dry_run=$DRY_RUN"
            echo "target_version=$TARGET_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Parameters:"
          echo "  Dry run: $DRY_RUN"
          echo "  Target version: $TARGET_VERSION"

      - name: Run migration (dry-run check)
        id: dry_run
        env:
          TARGET_VERSION: ${{ steps.params.outputs.target_version }}
        run: |
          echo "=== Dry Run ==="
          # 件数はログではなく --output-json の stdout から取る (ログは stderr のまま表示される)。
          # CLI の失敗 (errors > 0 は exit 1、未登録の目標バージョンは exit 2) は代入の失敗としてステップを止める
          RAW_STATS=$(uv run --locked migrate-metadata --dry-run --target-version "$TARGET_VERSION" --output-json)
          PROCESSED_STATS=$(uv run --locked migrate-metadata --dry-run --target-version "$TARGET_VERSION" \
            --metadata-dir data/processed/.metadata --data-dir data/processed --output-json)
          RAW_MIGRATED=$(jq -er '.migrated' <<<"$RAW_STATS")
          PROCESSED_MIGRATED=$(jq -er '.migrated' <<<"$PROCESSED_STATS")
          {
            echo "raw_migrated=$RAW_MIGRATED"
            echo "processed_migrated=$PROCESSED_MIGRATED"
            echo "migrated_count=$((RAW_MIGRATED + PROCESSED_MIGRATED))"
          } >> "$GITHUB_OUTPUT"

      - name: Run migration
        id: migrate
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        env:
          TARGET_VERSION: ${{ steps.params.outputs.target_version }}
        run: |
          echo "=== Running Migration (raw) ==="
          uv run --locked migrate-metadata --target-version "$TARGET_VERSION" --verbose
          echo "=== Running Migration (processed) ==="
          uv run --locked migrate-metadata --target-version "$TARGET_VERSION" --verbose \
            --metadata-dir data/processed/.metadata --data-dir data/processed

      - name: Run verification
        id: verify
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          echo "=== Running Verification ==="
          # 検証を実行 (--verbose と --output-json を同時使用)
          # ログはstderr、JSONはstdoutに出力される
          STATS=$(uv run --locked verify-metadata --only-unverified --verbose --output-json)

          # jq で堅牢にパース
          VERIFIED=$(echo "$STATS" | jq -r '.verified // 0')
          FAILED=$(echo "$STATS" | jq -r '.failed // 0')
          {
            echo "verified_count=$VERIFIED"
            echo "failed_count=$FAILED"
          } >> "$GITHUB_OUTPUT"
          echo "Verification completed: verified=$VERIFIED, failed=$FAILED"

      # 目標バージョンが METADATA_VERSION と異なる (部分移行) 場合は version 検査で赤になり、PR は作られない
      - name: Validate metadata schema
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: uv run --locked python scripts/validate_metadata_schema.py --version-profiles tokyo-idsc-raw,tokyo-idsc-processed

      - name: Configure git
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set environment variables
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        run: |
          {
            echo "CURRENT_DATE=$(date +'%Y-%m-%d')"
            echo "FETCH_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')"
          } >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: steps.params.outputs.dry_run == 'false' && steps.dry_run.outputs.migrated_count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TARGET_VERSION: ${{ steps.params.outputs.target_version }}
          MIGRATED_COUNT: ${{ steps.dry_run.outputs.migrated_count }}
        run: |
          git add -- data/raw/.metadata data/processed/.metadata

          if ! git diff --staged --quiet; then
            # 共通スクリプトを呼び出し
            bash scripts/create_pr.sh "migrate-metadata" "メタデータマイグレーション"
          else
            echo "No changes to commit"
          fi

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET_VERSION: ${{ steps.params.outputs.target_version }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          MIGRATED_COUNT: ${{ steps.dry_run.outputs.migrated_count }}
          RAW_MIGRATED: ${{ steps.dry_run.outputs.raw_migrated }}
          PROCESSED_MIGRATED: ${{ steps.dry_run.outputs.processed_migrated }}
          VERIFIED_COUNT: ${{ steps.verify.outputs.verified_count }}
          FAILED_COUNT: ${{ steps.verify.outputs.failed_count }}
        run: |
          # 変数のデフォルト値を設定 (前のステップが失敗した場合に備える)
          TARGET_VERSION="${TARGET_VERSION:-不明}"
          DRY_RUN="${DRY_RUN:-不明}"
          MIGRATED_COUNT="${MIGRATED_COUNT:-不明}"
          RAW_MIGRATED="${RAW_MIGRATED:-不明}"
          PROCESSED_MIGRATED="${PROCESSED_MIGRATED:-不明}"
          VERIFIED_COUNT="${VERIFIED_COUNT:-0}"
          FAILED_COUNT="${FAILED_COUNT:-0}"

          {
            echo "## 🔀 メタデータマイグレーションサマリー"
            echo ""
            echo "- **目標バージョン**: $TARGET_VERSION"
            echo "- **マイグレーション対象**: ${MIGRATED_COUNT}ファイル (raw: ${RAW_MIGRATED}ファイル / processed: ${PROCESSED_MIGRATED}ファイル)"
            echo "- **ドライラン**: $DRY_RUN"
            echo ""

            # 失敗したら件数に関係なく失敗を表示する (✅ の分岐に入らない)
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ マイグレーションが失敗しました (job.status: $JOB_STATUS)。ワークフローのログを確認してください。"
            elif [ "$DRY_RUN" = "true" ]; then
              echo "⚠️ **ドライランモード**: 変更は保存されていません。"
            elif [ "$MIGRATED_COUNT" = "0" ]; then
              echo "✅ すべてのメタデータファイルは既に目標バージョンです。"
            else
              echo "✅ マイグレーションが正常に完了しました。"
              echo ""
              echo "### 検証結果 (raw のファイル形式)"
              echo "- **検証成功**: ${VERIFIED_COUNT}ファイル"
              echo "- **検証失敗**: ${FAILED_COUNT}ファイル"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
