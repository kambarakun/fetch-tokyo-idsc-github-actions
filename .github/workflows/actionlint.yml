name: 🔍 ワークフロー静的検証 (actionlint)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

# 最小権限原則 (issue #299):
# - contents: read (checkout)
# - checks: write (reviewdog の github-check reporter による Check Run 作成)
permissions:
  contents: read
  checks: write

# 同一PR/branchへの連続pushで実行が積み上がるのを防ぐ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run actionlint
        # SHA pinned per CLAUDE.md sec.2.1 (Dependabot github-actions 運用)
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # github-check: push/PR/dispatch すべてのトリガで動作する Check Run 形式。
          # github-pr-review は PR コンテキスト前提のため push 実行時に annotation が
          # 落ちる課題があり、Check Run に統一して全イベント対応する。
          reporter: github-check
          # error レベルのみ CI 失敗とする (info/style はノイズ削減のためフィルタ)。
          # 段階的に warning/style へ厳格化する場合は本フラグを段階的に変更する。
          level: error
          fail_on_error: true
          # file: 変更ファイル全体を対象 (diff行外も含む)。
          # actionlint は workflow ファイル単位の静的検証なので、PRの変更ファイル
          # に絞り込む `file` モードが最適。nofilter は無関係な既存違反まで全件
          # 報告するため過剰。added (新規追加行のみ) は既存違反を見落とすため不適。
          filter_mode: file
          # shellcheck 統合は有効。reviewdog が shellcheck の severity を独自に
          # マップする問題があるが、本リポジトリは shellcheck の info/style 違反を
          # 全件解消済み (chore/shellcheck-cleanup) のため CI失敗には至らない。
          # 万一 reviewdog の severity 解釈で過剰検知が発生した場合の暫定回避策は
          # `actionlint_flags: -shellcheck=` で shellcheck を無効化すること。
