version: 2
updates:
  # 🔄 GitHub Actionsの依存関係を更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Delay version-update PRs for supply-chain observation; security updates are exempt.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
    # メジャーバージョンアップを無視（破壊的変更を手動でレビュー）
    # セキュリティ更新は別途Dependabot Security Updatesで自動作成される
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 📦 Python依存関係を更新 (uvネイティブサポート)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Delay version-update PRs for supply-chain observation; security updates are exempt.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5
    # メジャーバージョンアップを無視（破壊的変更を手動でレビュー）
    # マイナー・パッチバージョンのみ自動更新
    # セキュリティ更新は別途Dependabot Security Updatesで自動作成される
    # 注: Dependabotはuvをネイティブサポート (2025年3月13日〜)
    # pyproject.tomlとuv.lockの両方を自動更新
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # 依存関係のグループ化（関連する更新をまとめる）
    groups:
      # 🏭 本番依存関係をまとめる（慎重にレビュー）
      production:
        patterns:
          - "requests"
          - "PyYAML"
        update-types:
          - "minor"
          - "patch"
      # 🧪 テスト関連の依存関係をまとめる
      testing:
        patterns:
          - "pytest*"
          - "pytest-cov"
      # 🔧 ビルドツール関連をまとめる（リンター・フォーマッター）
      build-tools:
        patterns:
          - "ruff"
          - "black"
          - "isort"
          - "mypy"
          - "pre-commit"
      # 📝 型定義ファイルをまとめる
      type-stubs:
        patterns:
          - "types-*"

  # 🪝 pre-commit フックを更新 (2026-03-10 から Dependabot ネイティブサポート)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Delay version-update PRs for supply-chain observation; security updates are exempt.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "pre-commit"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    # メジャーバージョンアップは無視 (破壊的変更を手動でレビュー)
    # actionlint は SHA pin 運用のため Dependabot も SHA を更新する。github-actions 同様レビュー必須。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
