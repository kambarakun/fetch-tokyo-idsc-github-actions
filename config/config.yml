# 東京都感染症発生動向データ収集設定ファイル

# スケジュール設定
# 注: この cron は config_manager が読み込む設定値だが、実際の定期実行は
#     GitHub Actions の .github/workflows/fetch-data-daily.yml (cron: "0 8 * * *") と
#     fetch-data-weekly.yml (cron: "30 8 * * 4") が制御する。両者は独立しているため、
#     ここの値を変更しても自動実行スケジュールは変わらない点に注意。
schedule:
  cron: "0 10 * * 1" # (参考値) 毎週月曜日 19:00 JST (10:00 UTC)
  timezone: "Asia/Tokyo"
  manual_trigger_enabled: true

# データ収集設定
collection:
  # データ収集モード (incremental | full | force)
  # - incremental: 欠損データのみ取得 (既存ファイルをスキップ) - デフォルト
  # - full: 全期間のデータを取得し、既存も更新チェック
  # - force: 全データを強制的に再取得
  mode: "incremental"
  # incremental_mode: true  # (非推奨) mode を使用してください。
  #   mode が未設定 (null) のときのみ後方互換フォールバックとして参照されます
  #   (優先順位: CLI --mode > collection.mode > incremental_mode > デフォルト incremental)
  batch_size: 50 # 一度に処理するファイル数
  start_year: 2024 # デフォルトの開始年（初回は2000年から実行推奨）
  end_year: null # 終了年。CLI の --end-year が優先し、両方とも無い (null) 場合は JST の現在年
  data_types:
    - sentinel_weekly_gender
    - sentinel_weekly_age
    - sentinel_weekly_health_center
    - sentinel_weekly_medical_district
    - sentinel_monthly_gender
    - sentinel_monthly_age
    - sentinel_monthly_health_center
    - sentinel_monthly_medical_district
    - notifiable_weekly
  max_execution_time_hours: 5.5 # GitHub Actions の6時間制限対策

# ストレージ設定
# 注: ファイルサイズの検証範囲は src/managers/storage_manager.py の VALIDATION_* 定数 (100B - 50MB) が唯一の定義。
storage:
  base_directory: "data/raw"
