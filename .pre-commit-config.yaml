# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Upstream hooks pin `rev:` to a full commit SHA with the version comment on the same line, like
  # the workflow actions (AGENTS.md). Plain `pre-commit autoupdate` writes tags back, so use
  # `pre-commit autoupdate --freeze` when updating by hand. tests/test_dependabot_config.py checks this.

  # 基本的なファイルチェック
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        name: 末尾の空白を削除
        # Generated data, fixtures and lock files are not linted or formatted. This used to be the
        # top-level `exclude`, which pre-commit applies to every hook and no hook can override; it
        # moved onto each hook so that gitleaks alone also scans these paths (issue #736).
        # tests/test_secret_scan.py checks that every other hook keeps it.
        exclude: &repo_exclude |
          (?x)(
            ^tests/fixtures/|
            ^data/|
            \.csv$|
            \.lock$|
            ^\.venv/|
            ^venv/|
            ^__pycache__/
          )
      - id: end-of-file-fixer
        name: ファイル末尾に改行を追加
        exclude: *repo_exclude
      - id: check-yaml
        name: YAMLファイルの構文チェック
        exclude: *repo_exclude
      - id: check-added-large-files
        name: 大きなファイルの追加を防ぐ
        exclude: *repo_exclude
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
        name: マージコンフリクトマーカーのチェック
        exclude: *repo_exclude
      - id: check-json
        name: JSONファイルの構文チェック
        exclude: *repo_exclude
      - id: check-toml
        name: TOMLファイルの構文チェック
        exclude: *repo_exclude
      - id: debug-statements
        name: デバッグステートメントのチェック
        exclude: *repo_exclude
      - id: mixed-line-ending
        name: 改行コードの統一
        exclude: *repo_exclude
        args: ["--fix=lf"]

  # 秘密情報の検出 (issue #736、docs/secret-scanning.md)
  # The upstream entry (`gitleaks git --pre-commit --staged`) reads only the index, so CI's
  # `pre-commit run --all-files` would pass without scanning anything. The entry is replaced by a
  # wrapper that scans the file names pre-commit passes: the staged files on commit, every tracked
  # text file (data/ and tests/fixtures/ included, hence no `exclude: *repo_exclude`) under
  # --all-files. The hook environment still builds the pinned gitleaks and puts it on PATH.
  # `language_version` pins the Go toolchain pre-commit downloads, so the hook does not depend on
  # whatever `go` is on PATH; it must stay at or above the `go` line of gitleaks' go.mod
  # (pre-commit sets GOTOOLCHAIN=local).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: 秘密情報の検出 (gitleaks)
        entry: python3 scripts/check_secrets.py
        language_version: 1.27.3
        pass_filenames: true
        types: [text]
        require_serial: true

  # プロジェクト固有のチェック (フォーマット前に実行)
  - repo: local
    hooks:
      - id: fix-fullwidth-symbols
        name: 全角記号を半角に自動修正
        exclude: *repo_exclude
        entry: python3 scripts/fix_fullwidth_symbols.py
        language: system
        types_or: [python, markdown]
        pass_filenames: true

  # Python ツール (isort / black / ruff / mypy)
  # uv が管理するプロジェクト venv の実体を local hook として実行する (issue #680)。
  # バージョンの単一ソースは pyproject.toml + uv.lock で、更新経路は Dependabot の uv
  # エコシステム (build-tools グループ) のみ。上流 `rev:` 参照に戻すと pre-commit / uv の
  # 両エコシステムが別々に更新して必ず版ずれし CI が赤くなるため、
  # tests/test_dependabot_config.py が local hook の維持を検証している。
  # - `--extra dev`: `uv sync` 未実施の新規 clone でも hook が自己ブートストラップする
  # - `--locked`: uv.lock と pyproject.toml が不整合なら実行せず失敗する (fail closed)
  # - `types_or` / `require_serial` は各上流 hook 定義と同じ値を維持している
  # - Tool settings (line length, profile, mypy options) live only in pyproject.toml, never in `args:`:
  #   command-line flags override the config file and would silently mask a change made there.
  - repo: local
    hooks:
      # Pythonコードフォーマット (isort)
      - id: isort
        name: import文の整理
        exclude: *repo_exclude
        entry: uv run --locked --extra dev isort
        language: system
        types_or: [cython, pyi, python]
        require_serial: true

      # Pythonコードフォーマット (black)
      - id: black
        name: Pythonコードのフォーマット
        exclude: *repo_exclude
        entry: uv run --locked --extra dev black
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Pythonコード品質チェック (Ruff リンター)
      # 注: コードフォーマットは black に一任する。ruff-format と black を二重適用すると
      # 両者が互いに異なる整形を要求し競合する (バージョン更新時に顕在化) ため ruff-format は使わない。
      # CI (test.yml) も全 pre-commit hook 経由で black を実行しており、black 一本化が整合的。
      - id: ruff
        name: Ruff リンター
        exclude: *repo_exclude
        entry: uv run --locked --extra dev ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: ["--fix", "--exit-non-zero-on-fix"]

      # 型チェック (mypy)
      # 型情報は venv 内の実行時依存 (requests 同梱の py.typed / types-PyYAML) をそのまま使う。
      # additional_dependencies で別途 pin すると uv.lock と二重管理になるため持たない。
      - id: mypy
        name: Python型チェック
        exclude: *repo_exclude
        entry: uv run --locked --extra dev mypy
        language: system
        types_or: [python, pyi]
        require_serial: true

  # Markdownファイルのフォーマット
  # mirrors-prettier (pre-commit 公式) は 2024 年にアーカイブされたため後継の rbubley/mirrors-prettier を使用
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # v3.9.10
    hooks:
      - id: prettier
        name: Markdown/YAML/JSONのフォーマット
        exclude: *repo_exclude
        types_or: [markdown, yaml, json]
        # Prettier 3.9+ reformats the body of ```markdown fences, rewriting `[*]` in escaped Mermaid
        # examples to `[_]` (tests/formatter_regressions/prettier-markdown.md). Keep fenced code verbatim.
        args: ["--print-width", "120", "--prose-wrap", "preserve", "--embedded-language-formatting", "off"]

  # プロジェクト固有のチェック
  - repo: local
    hooks:
      - id: check-tree-comment-alignment
        name: tree形式コメント位置統一チェック
        exclude: *repo_exclude
        entry: python3 scripts/check_tree_comment_alignment.py
        language: system
        types: [markdown]
        pass_filenames: true
      - id: check-deprecated-cli-usage
        name: issue312 旧CLI導線チェック
        exclude: *repo_exclude
        entry: python3 scripts/check_deprecated_cli_usage.py
        language: system
        pass_filenames: false

  # GitHub Actions ワークフロー静的検証 (issue #308)
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        name: GitHub Actions ワークフロー検証 (actionlint)
        exclude: *repo_exclude
        # shellcheck 統合も有効化済 (info/style 違反は chore/shellcheck-cleanup
        # で全件解消)。万一 shellcheck の過剰検知でローカル開発が止まる場合は
        # 一時的に `args: ["-shellcheck="]` を追加して回避可能。

# 設定
default_language_version:
  python: python3.11

# コミット時に自動実行
default_stages: [pre-commit]
