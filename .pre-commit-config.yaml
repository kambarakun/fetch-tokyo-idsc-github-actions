# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # 基本的なファイルチェック
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: 末尾の空白を削除
      - id: end-of-file-fixer
        name: ファイル末尾に改行を追加
      - id: check-yaml
        name: YAMLファイルの構文チェック
      - id: check-added-large-files
        name: 大きなファイルの追加を防ぐ
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
        name: マージコンフリクトマーカーのチェック
      - id: check-json
        name: JSONファイルの構文チェック
      - id: check-toml
        name: TOMLファイルの構文チェック
      - id: debug-statements
        name: デバッグステートメントのチェック
      - id: mixed-line-ending
        name: 改行コードの統一
        args: ["--fix=lf"]

  # プロジェクト固有のチェック (フォーマット前に実行)
  - repo: local
    hooks:
      - id: fix-fullwidth-symbols
        name: 全角記号を半角に自動修正
        entry: python3 scripts/fix_fullwidth_symbols.py
        language: system
        types_or: [python, markdown]
        pass_filenames: true

  # Pythonコードフォーマット (isort)
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: import文の整理
        args: ["--profile", "black", "--line-length", "120"]

  # Pythonコードフォーマット (black)
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        name: Pythonコードのフォーマット
        language_version: python3.11
        args: ["--line-length", "120"]

  # Pythonコード品質チェック (Ruff リンター)
  # 注: コードフォーマットは black に一任する。ruff-format と black を二重適用すると
  # 両者が互いに異なる整形を要求し競合する (バージョン更新時に顕在化) ため ruff-format は使わない。
  # CI (test.yml) も black --check を採用しており black 一本化が整合的。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: Ruff リンター
        args: ["--fix", "--exit-non-zero-on-fix"]

  # 型チェック (mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: Python型チェック
        args: ["--ignore-missing-imports", "--no-strict-optional", "--python-version=3.11"]
        additional_dependencies: [requests==2.34.2, types-PyYAML]

  # Markdownファイルのフォーマット
  # mirrors-prettier (pre-commit 公式) は 2024 年にアーカイブされたため後継の rbubley/mirrors-prettier を使用
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        name: Markdown/YAML/JSONのフォーマット
        types_or: [markdown, yaml, json]
        args: ["--print-width", "120", "--prose-wrap", "preserve"]

  # プロジェクト固有のチェック
  - repo: local
    hooks:
      - id: check-tree-comment-alignment
        name: tree形式コメント位置統一チェック
        entry: python3 scripts/check_tree_comment_alignment.py
        language: system
        types: [markdown]
        pass_filenames: true
      - id: check-deprecated-cli-usage
        name: issue312 旧CLI導線チェック
        entry: python3 scripts/check_deprecated_cli_usage.py
        language: system
        pass_filenames: false

  # GitHub Actions ワークフロー静的検証 (issue #308)
  - repo: https://github.com/rhysd/actionlint
    # SHA pinned (CLAUDE.md sec.2.1 SHA pin方針の pre-commit `rev:` への拡張適用)。
    # Note: `pre-commit autoupdate` はデフォルトでタグ参照に戻すため、SHA を
    # 維持したい場合は `pre-commit autoupdate --freeze` を使用する必要がある。
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        name: GitHub Actions ワークフロー検証 (actionlint)
        # shellcheck 統合も有効化済 (info/style 違反は chore/shellcheck-cleanup
        # で全件解消)。万一 shellcheck の過剰検知でローカル開発が止まる場合は
        # 一時的に `args: ["-shellcheck="]` を追加して回避可能。

# 設定
default_language_version:
  python: python3.11

# コミット時に自動実行
default_stages: [pre-commit]

# ファイル除外設定
exclude: |
  (?x)(
    ^tests/fixtures/|
    ^data/|
    \.csv$|
    \.lock$|
    ^\.venv/|
    ^venv/|
    ^__pycache__/
  )

# CI設定
ci:
  autofix_prs: true
  autofix_commit_msg: "style: pre-commit自動修正を適用"
  autoupdate_commit_msg: "chore: pre-commitフックを更新"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
